<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Konbini Ears">
<meta name="theme-color" content="#0f7a5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Konbini Ears</title>
<style>
:root {
  --bg: #f6f4ee; --card: #ffffff; --ink: #1d2128; --muted: #646a74; --line: #e3dfd4;
  --accent: #0f7a5c; --accent-ink: #ffffff; --accent-soft: #dcefe7;
  --stripe1: #0f7a5c; --stripe2: #f08c1a; --stripe3: #2b62c4;
  --good: #1f8a4c; --good-soft: #def2e4; --bad: #c2412d; --bad-soft: #f8e1dc; --warn-soft: #fbefd9;
  --shadow: 0 1px 2px rgba(20, 20, 30, .06), 0 4px 14px rgba(20, 20, 30, .05);
  --jp: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121418; --card: #1b1e24; --ink: #eceae4; --muted: #9aa0aa; --line: #2b2f37;
    --accent: #34b58a; --accent-ink: #0c1512; --accent-soft: #183a2f;
    --good: #4cc47e; --good-soft: #17301f; --bad: #ef7a64; --bad-soft: #3a1d18; --warn-soft: #3a2c14;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121418; --card: #1b1e24; --ink: #eceae4; --muted: #9aa0aa; --line: #2b2f37;
  --accent: #34b58a; --accent-ink: #0c1512; --accent-soft: #183a2f;
  --good: #4cc47e; --good-soft: #17301f; --bad: #ef7a64; --bad-soft: #3a1d18; --warn-soft: #3a2c14;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
       padding: env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom)); }
button { font: inherit; color: inherit; cursor: pointer; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
.stripes { display: flex; height: 6px; }
.stripes i { flex: 1; } .stripes i:nth-child(1) { background: var(--stripe1); }
.stripes i:nth-child(2) { background: var(--stripe2); } .stripes i:nth-child(3) { background: var(--stripe3); }
header { padding: 14px 0 6px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
header h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
header h1 small { font: 500 13px var(--jp); color: var(--muted); margin-left: 6px; }
.sub { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); }
.stack > * + * { margin-top: 10px; }
.row { display: flex; gap: 8px; align-items: center; }
.grow { flex: 1; min-width: 0; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 11px; padding: 10px 14px; min-height: 44px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.chip { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 2px 8px; white-space: nowrap; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 11px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: transparent; padding: 9px 4px; min-height: 40px; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 0 0 6px; }
.scene { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--card);
         border-radius: 14px; padding: 13px 14px; box-shadow: var(--shadow); }
.scene b { font-size: 17px; } .scene p { margin: 3px 0 0; font-size: 14px; color: var(--muted); }
.meter { height: 5px; border-radius: 9px; background: var(--line); margin-top: 9px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.big-play { width: 104px; height: 104px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink);
            display: grid; place-items: center; margin: 6px auto 4px; box-shadow: 0 6px 20px rgba(15, 122, 92, .3); }
.big-play.playing { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(.94); } }
.big-play svg { width: 44px; height: 44px; }
.who { text-align: center; font-size: 13px; color: var(--muted); }
.choices { display: grid; gap: 8px; }
.choice { text-align: left; border: 1.5px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px 14px; min-height: 48px; }
.choice.right { border-color: var(--good); background: var(--good-soft); }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
.reveal { border-top: 1px dashed var(--line); padding-top: 12px; }
.jp { font: 600 24px/1.35 var(--jp); }
.kana { font: 15px var(--jp); color: var(--muted); }
.ro { font-style: italic; color: var(--muted); font-size: 15px; }
.en { font-size: 17px; }
.tip { font-size: 14px; border-radius: 10px; padding: 8px 11px; background: var(--accent-soft); }
.tip.speed { background: var(--warn-soft); }
.line { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); }
.line:first-child { border-top: 0; }
.line .jp { font-size: 17px; }
.mini { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--card);
        display: grid; place-items: center; }
.mini.playing { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.mini svg { width: 16px; height: 16px; }
.verdict { font-weight: 700; } .verdict.good { color: var(--good); } .verdict.bad { color: var(--bad); }
.progress { height: 4px; background: var(--line); border-radius: 9px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
nav .wrap { display: flex; }
nav button { flex: 1; border: 0; background: none; padding: 10px 0 9px; font-size: 12px; color: var(--muted); display: grid; justify-items: center; gap: 2px; }
nav button[aria-current="page"] { color: var(--accent); font-weight: 600; }
nav svg { width: 22px; height: 22px; }
details summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%);
         background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 14px; max-width: 90vw; z-index: 9; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.stat { font: 700 34px/1 -apple-system, system-ui, sans-serif; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="stripes" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="wrap">
  <header><h1>Konbini Ears<small>コンビニの耳</small></h1><span class="chip" id="speedChip"></span></header>
  <main id="app"></main>
</div>
<nav><div class="wrap">
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Scenes</button>
  <button data-tab="drill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h3l3-8 4 16 3-8h5"/></svg>Misses</button>
  <button data-tab="book"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></svg>Phrases</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Settings</button>
</div></nav>
<div class="toast" id="toast" hidden></div>

<script>/*__KE_DATA__*/</script>
<script>
(() => {
  "use strict";
  const D = window.KE, A = window.KE_AUDIO || [];
  const $ = id => document.getElementById(id);
  const app = $("app");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pick = a => a[Math.random() * a.length | 0];
  const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.6-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
  const ICON_EAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 8.5a6 6 0 1 1 12 0c0 3.5-3 4.5-3 7.5a3.5 3.5 0 0 1-6.6 1.6"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-1.5 2-1.5 3.5"/></svg>';

  // ── storage (per device; the page works without it) ──
  const KEY = "konbini-ears:v1";
  const S = { speed: 1.15, voice: "mix", theme: "auto", miss: {}, scenes: {} };
  try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) { /* private mode */ }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } };
  const applyTheme = () => { if (S.theme === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = S.theme; };
  applyTheme();

  // ── index the pack ──
  const staffSteps = [], variantById = {};
  for (const sc of D.scenes) for (const st of sc.steps) {
    st.scene = sc;
    if (st.kind !== "you") staffSteps.push(st);
    for (const v of st.say) { v.step = st; variantById[v.id] = v; }
  }

  // ── audio ──
  // Clips are inlined as base64. Play from a Blob URL; if the element refuses, decode the same bytes
  // with Web Audio, which loads no URL and so survives sandboxes that block blob:/data: media.
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) { /* not offered */ }
  const blobUrls = new Map();
  let cur = null, curSrc = null, curBtn = null, actx = null;
  const bytes = i => { const bin = atob(A[i]), u8 = new Uint8Array(bin.length); for (let k = 0; k < bin.length; k++) u8[k] = bin.charCodeAt(k); return u8; };
  const urlFor = i => { if (!blobUrls.has(i)) blobUrls.set(i, URL.createObjectURL(new Blob([bytes(i)], { type: "audio/mpeg" }))); return blobUrls.get(i); };
  function ctx() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { actx = actx || new AC(); } catch (e) { return null; }
    if (actx.state === "suspended") actx.resume().catch(() => {});
    return actx;
  }
  function stop() {
    if (cur) { cur.pause(); cur = null; }
    if (curSrc) { try { curSrc.stop(); } catch (e) { /* done */ } curSrc = null; }
    if (curBtn) { curBtn.classList.remove("playing"); curBtn = null; }
  }
  function clipFor(line, voice) {
    const a = line.a || {}, keys = Object.keys(a);
    if (!keys.length) return null;
    return a[voice] ?? a[keys[0]];
  }
  function chooseVoice(line) {
    const keys = Object.keys(line.a || {});
    if (S.voice === "f") return keys.find(k => k.startsWith("jf")) || keys[0];
    if (S.voice === "m") return keys.find(k => k.startsWith("jm")) || keys[0];
    return pick(keys);
  }
  function play(i, rate, btn) {
    stop();
    if (i == null) { toast("No audio for this line."); return; }
    ctx();                          // unlock Web Audio inside this tap, in case the fallback needs it
    const done = () => btn && btn.classList.remove("playing");
    if (btn) { curBtn = btn; btn.classList.add("playing"); }
    const el = new Audio();
    cur = el;
    el.preservesPitch = el.webkitPreservesPitch = true;
    el.onended = done;
    el.src = urlFor(i);
    el.defaultPlaybackRate = el.playbackRate = rate;
    el.play().catch(async err => {
      if (err && err.name === "NotAllowedError") { done(); toast("Tap the ear to play."); return; }
      try {
        const c = ctx(), buf = await c.decodeAudioData(bytes(i).buffer), src = c.createBufferSource();
        src.buffer = buf; src.playbackRate.value = rate; src.connect(c.destination); src.start();
        if (cur === el) { cur = null; curSrc = src; src.onended = done; }
      } catch (e2) { done(); toast("Couldn't play audio here."); }
    });
  }
  let toastT;
  function toast(m) { const t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 2400); }

  // ── scoring: a miss adds 2, a clean first-listen hit takes 1 off; the misses drill pulls by weight ──
  function mark(v, ok, replayed) {
    const m = S.miss[v.id] || 0;
    S.miss[v.id] = ok ? Math.max(0, m - (replayed ? 0 : 1)) : m + 2;
    if (!S.miss[v.id]) delete S.miss[v.id];
    save();
  }
  const missCount = () => Object.keys(S.miss).filter(id => variantById[id]).length;

  // ── answer choices: the right meaning plus confusable ones, same scene first ──
  function choicesFor(v) {
    if (v.choices) return { right: v.choices[0], list: shuffle(v.choices) };
    const right = v.en || v.step.en;
    // A step that shares any line with this one (いらっしゃいませ in every scene) could also be
    // "right", so it never supplies a wrong answer.
    const mine = new Set(v.step.say.map(x => x.ja));
    const fair = st => st.kind !== "you" && st !== v.step && !st.say.some(x => mine.has(x.ja));
    const pool = steps => steps.filter(fair).flatMap(st => [st.en, ...st.say.map(x => x.en).filter(Boolean)]);
    const same = shuffle(pool(v.step.scene.steps));
    const other = shuffle(pool(staffSteps.filter(st => st.scene !== v.step.scene)));
    const out = [right];
    for (const e of [...same.slice(0, 2), ...other, ...same.slice(2)]) { if (out.length >= 4) break; if (!out.includes(e)) out.push(e); }
    return { right, list: shuffle(out) };
  }

  // ── views ──
  function setTab(t) {
    stop();
    document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === t ? "page" : "false"));
    ({ home, drill: drillHome, book, settings })[t]();
    window.scrollTo(0, 0);
  }
  document.querySelectorAll("nav button").forEach(b => (b.onclick = () => setTab(b.dataset.tab)));
  const speedLabel = () => { $("speedChip").textContent = `${S.speed}× speed`; };

  function seg(name, opts, val) {
    return `<div class="seg" data-seg="${name}">${opts.map(([v, l]) => `<button data-v="${v}" aria-pressed="${String(v) === String(val)}">${l}</button>`).join("")}</div>`;
  }
  function wireSeg(name, on) {
    const el = app.querySelector(`[data-seg="${name}"]`);
    el.querySelectorAll("button").forEach(b => (b.onclick = () => {
      el.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      on(b.dataset.v);
    }));
  }

  function home() {
    speedLabel();
    const n = missCount();
    app.innerHTML = `
      <p class="sub">${esc(D.subtitle)}</p>
      <div class="stack">
        <div class="card stack">
          <p class="label">Speed</p>
          ${seg("speed", [[1, "1.0×"], [1.15, "1.15×"], [1.3, "1.3×"], [1.5, "1.5×"]], S.speed)}
          <div class="row"><button class="btn primary grow" id="mixed">Mixed run</button>
          <button class="btn grow" id="misses" ${n ? "" : "disabled"}>Drill misses (${n})</button></div>
        </div>
        ${D.scenes.map(sc => {
          const st = S.scenes[sc.id], pct = st && st.n ? Math.round(100 * st.ok / st.n) : null;
          return `<button class="scene" data-scene="${sc.id}">
            <div class="row"><b class="grow">${esc(sc.title)}</b>${pct == null ? '<span class="chip">new</span>' : `<span class="chip">${pct}% heard</span>`}</div>
            <p>${esc(sc.blurb)}</p>${pct == null ? "" : `<div class="meter"><i style="width:${pct}%"></i></div>`}</button>`;
        }).join("")}
      </div>`;
    wireSeg("speed", v => { S.speed = +v; save(); speedLabel(); });
    $("mixed").onclick = () => run(mixedRun(), "Mixed run");
    $("misses").onclick = () => setTab("drill");
    app.querySelectorAll("[data-scene]").forEach(b => (b.onclick = () => {
      const sc = D.scenes.find(s => s.id === b.dataset.scene);
      run(sceneRun(sc), sc.title, sc);
    }));
  }

  function sceneRun(sc) {
    if (sc.steps.every(st => st.kind === "you")) return shuffle(sc.steps).slice(0, 8).map(st => ({ st, v: pick(st.say) }));
    return sc.steps.filter(st => Math.random() < (st.p ?? 1)).map(st => ({ st, v: pick(st.say) }));
  }
  const mixedRun = () => shuffle(staffSteps).slice(0, 10).map(st => ({ st, v: pick(st.say) }));

  // ── a run: one step at a time ──
  function run(items, title, scene) {
    let i = 0, ok = 0, clean = 0, staffN = 0;
    const missed = [];
    const next = () => { i++; step(); };
    function step() {
      stop();
      if (i >= items.length) return finish();
      const { st, v } = items[i];
      const head = `<div class="row small muted"><span class="grow">${esc(title)}</span><span>${i + 1} / ${items.length}</span></div>
        <div class="progress"><i style="width:${Math.round(100 * i / items.length)}%"></i></div>`;
      if (st.kind === "you") return youStep(st, v, head);
      staffN++;
      staffStep(st, v, head);
    }

    function staffStep(st, v, head) {
      const voice = chooseVoice(v), clip = clipFor(v, voice), ch = choicesFor(v);
      let plays = 0, answered = false;
      app.innerHTML = `<div class="stack">${head}
        <div class="card stack">
          <button class="big-play" id="play" aria-label="Play">${ICON_EAR}</button>
          <div class="who">${voice && voice.startsWith("jm") ? "Staff (man)" : "Staff (woman)"} · tap the ear to hear it again</div>
          <button class="btn wide" id="slow">Slow (0.75×)</button>
          <p class="label" style="margin-top:14px">What did they say?</p>
          <div class="choices">${ch.list.map((c, k) => `<button class="choice" data-k="${k}">${esc(c)}</button>`).join("")}</div>
          <div id="after"></div>
        </div></div>`;
      const playBtn = $("play");
      const go = rate => { plays++; play(clip, rate, playBtn); };
      playBtn.onclick = () => go(S.speed);
      $("slow").onclick = () => go(0.75);
      go(S.speed);
      app.querySelectorAll(".choice").forEach(b => (b.onclick = () => {
        if (answered) return;
        answered = true;
        const right = ch.list[+b.dataset.k] === ch.right, replayed = plays > 1;
        app.querySelectorAll(".choice").forEach(x => {
          if (ch.list[+x.dataset.k] === ch.right) x.classList.add("right"); else if (x === b) x.classList.add("wrong");
        });
        mark(v, right, replayed);
        if (right) { ok++; if (!replayed) clean++; } else missed.push(v);
        $("after").innerHTML = reveal(st, v, right, replayed) + `<button class="btn primary wide" id="next" style="margin-top:12px">Next</button>`;
        wireMinis($("after"));
        $("next").onclick = next;
        $("after").scrollIntoView({ behavior: "smooth", block: "start" });
      }));
    }

    function youStep(st, v, head) {
      app.innerHTML = `<div class="stack">${head}
        <div class="card stack">
          <p class="label">Your turn</p>
          <div class="en" style="font-size:20px">${esc(st.en)}</div>
          <p class="muted small">Say it out loud first, then check.</p>
          <button class="btn primary wide" id="show">Show the Japanese</button>
          <div id="after"></div>
        </div></div>`;
      $("show").onclick = () => {
        $("show").hidden = true;
        $("after").innerHTML = `<div class="reveal stack">${lineRow(v, true)}
          ${st.note ? `<div class="tip">${esc(st.note)}</div>` : ""}
          <div class="row"><button class="btn grow" id="again">Need practice</button><button class="btn primary grow" id="got">Got it</button></div></div>`;
        wireMinis($("after"));
        const mini = $("after").querySelector(".mini");
        if (mini) mini.click();
        $("got").onclick = () => { mark(v, true, false); next(); };
        $("again").onclick = () => { mark(v, false, false); missed.push(v); next(); };
      };
    }

    function finish() {
      stop();
      if (scene && staffN) {
        const s = S.scenes[scene.id] || { n: 0, ok: 0 };
        s.n += staffN; s.ok += ok; S.scenes[scene.id] = s; save();
      }
      app.innerHTML = `<div class="stack">
        <div class="card stack" style="text-align:center">
          <p class="label">${esc(title)}: done</p>
          ${staffN ? `<div class="stat">${ok} / ${staffN}</div><div class="muted">heard right, ${clean} on the first listen at ${S.speed}×</div>` : `<div class="muted">Practice round done.</div>`}
        </div>
        ${missed.length ? `<div class="card"><p class="label">Listen to these again</p>${missed.map(v => lineRow(v)).join("")}</div>` : ""}
        <div class="row"><button class="btn grow" id="home">Scenes</button><button class="btn primary grow" id="again">Go again</button></div>
      </div>`;
      wireMinis(app);
      $("home").onclick = () => setTab("home");
      $("again").onclick = () => run(scene ? sceneRun(scene) : mixedRun(), title, scene);
      if (staffN && clean === staffN && S.speed < 1.5) toast("Clean sweep. Try it faster.");
    }
    step();
  }

  function lineRow(line, big) {
    const i = clipFor(line, Object.keys(line.a || {})[0]);
    const en = line.en || (line.step && line.step.en) || "";
    return `<div class="line"><button class="mini" data-clip="${i ?? ""}" aria-label="Play">${ICON_PLAY}</button>
      <div class="grow"><div class="jp"${big ? ' style="font-size:22px"' : ""}>${esc(line.ja)}</div>
      <div class="kana">${esc(line.kana)}</div><div class="ro">${esc(line.ro)}</div>
      ${en ? `<div class="small">${esc(en)}</div>` : ""}</div></div>`;
  }
  function wireMinis(root) {
    root.querySelectorAll(".mini").forEach(b => (b.onclick = () => play(b.dataset.clip === "" ? null : +b.dataset.clip, 1, b)));
  }

  function reveal(st, v, right, replayed) {
    return `<div class="reveal stack" style="margin-top:12px">
      <div class="verdict ${right ? "good" : "bad"}">${right ? (replayed ? "Right, after a replay" : "Right, first listen") : "Not quite"}</div>
      <div class="line" style="border:0;padding:0"><button class="mini" data-clip="${clipFor(v, Object.keys(v.a)[0]) ?? ""}" aria-label="Play">${ICON_PLAY}</button>
        <div class="grow"><div class="jp">${esc(v.ja)}</div><div class="kana">${esc(v.kana)}</div><div class="ro">${esc(v.ro)}</div>
        <div class="en">${esc(v.en || st.en)}</div></div></div>
      ${(v.key || st.key) ? `<div class="tip"><b>Listen for</b> ${esc(v.key || st.key)}</div>` : ""}
      ${(v.heard || st.heard) ? `<div class="tip speed"><b>At full speed</b> ${esc(v.heard || st.heard)}</div>` : ""}
      ${st.note ? `<div class="small muted">${esc(st.note)}</div>` : ""}
      ${st.replies.length ? `<div><p class="label" style="margin-top:6px">You can say</p>${st.replies.map(r => lineRow(r)).join("")}</div>` : ""}
    </div>`;
  }

  // ── misses drill: weighted toward what you keep missing ──
  function drillHome() {
    const ids = Object.keys(S.miss).filter(id => variantById[id]);
    if (!ids.length) {
      app.innerHTML = `<div class="card stack" style="text-align:center"><p class="label">Misses</p>
        <div class="muted">Nothing missed yet. Every line you get wrong lands here and keeps coming back until you hear it clean.</div>
        <button class="btn primary wide" id="go">Start a mixed run</button></div>`;
      $("go").onclick = () => run(mixedRun(), "Mixed run");
      return;
    }
    const bag = ids.flatMap(id => Array(Math.min(6, S.miss[id])).fill(id));
    const items = Array.from({ length: Math.min(10, Math.max(ids.length, 5)) }, () => {
      const v = variantById[pick(bag)];
      return { st: v.step, v };
    });
    run(items, `Misses (${ids.length} lines)`);
  }

  // ── phrasebook ──
  function book() {
    app.innerHTML = `<p class="sub">Every line in the pack. Tap ▶ to hear it at normal speed.</p><div class="stack">
      ${D.scenes.map(sc => `<details class="card"><summary>${esc(sc.title)}</summary>
        ${sc.steps.map(st => `<div style="margin-top:12px"><p class="label">${st.kind === "you" ? "You say" : "Staff say"}: ${esc(st.en)}</p>
          ${st.say.map(v => lineRow(v)).join("")}
          ${st.replies.length ? `<p class="label" style="margin-top:8px">You can reply</p>${st.replies.map(r => lineRow(r)).join("")}` : ""}</div>`).join("")}
      </details>`).join("")}</div>`;
    wireMinis(app);
  }

  // ── settings ──
  function settings() {
    const lines = Object.keys(variantById).length;
    app.innerHTML = `<div class="stack">
      <div class="card stack"><p class="label">Staff voice</p>
        ${seg("voice", [["mix", "Mixed"], ["f", "Women"], ["m", "Men"]], S.voice)}
        <p class="label" style="margin-top:12px">Theme</p>
        ${seg("theme", [["auto", "Auto"], ["light", "Light"], ["dark", "Dark"]], S.theme)}
        <button class="btn wide" id="test" style="margin-top:12px">Test audio</button>
        <p class="small muted">No sound? Turn the volume up and tap the page once first.</p></div>
      <div class="card stack"><p class="label">How to use it</p>
        <div class="small">Do one scene before you walk into that kind of place. Get it clean at 1.15×, then move up to 1.3×. Busy staff talk at about 1.3–1.5× this voice.</div>
        <div class="small">The choices test meaning, not translation. Listen for the key word (袋, 温め, お箸), not every syllable.</div>
        <div class="small">Heard something you didn't catch? Jot down the bit you heard ("something like <i>atatame…ka</i>") and add it to the pack later.</div>
        <div class="small">On an iPhone, tap Share → Add to Home Screen. After that it opens like an app and works offline.</div></div>
      <div class="card stack"><p class="label">Progress</p>
        <div class="small">${lines} lines in ${D.scenes.length} scenes · ${missCount()} on your misses list</div>
        <button class="btn wide" id="reset">Reset progress on this device</button>
        <div class="small muted">Built ${esc(D.build.at || "")}. Voices: ${esc(D.voices.join(", "))} (Kokoro-82M).</div></div>
    </div>`;
    wireSeg("voice", v => { S.voice = v; save(); });
    wireSeg("theme", v => { S.theme = v; save(); applyTheme(); });
    $("test").onclick = e => { const v = variantById["kb-greet.0"] || Object.values(variantById)[0]; play(clipFor(v, chooseVoice(v)), 1, e.currentTarget); };
    // Two taps instead of confirm(): sandboxed viewers silently refuse dialogs.
    $("reset").onclick = e => {
      const b = e.currentTarget;
      if (!b.dataset.armed) { b.dataset.armed = "1"; b.textContent = "Tap again to clear scores and misses"; return; }
      S.miss = {}; S.scenes = {}; save(); settings(); toast("Progress cleared.");
    };
  }

  setTab("home");

  // Offline copy when served from a real site (GitHub Pages). Not offered inside sandboxed viewers.
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(() => { /* no sw.js next to this copy */ });
  }
})();
</script>
</body>
</html>
