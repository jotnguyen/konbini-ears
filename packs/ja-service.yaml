# Konbini Ears — Japanese pack: service encounters, getting around, and small talk.
#
# A pack is a list of scenes. A scene is an ordered list of steps; a drill run walks the steps in
# order, keeps each one with probability `p`, and picks one variant at random, in a random voice.
#
# Step fields:
#   id       stable id (kebab-case, unique in the pack)
#   kind     staff (default) = they say it, you identify it
#            you             = you say it: `en` is what you want, the variants are model answers
#   p        chance the step appears in a run (default 1)
#   en       what it means (the right answer in the "what did they ask?" choice)
#   key      the word to listen for, with its meaning
#   heard    how it tends to sound at full speed (reductions, swallowed vowels)
#   say      variants: {ja, kana, en?, choices?}
#              kana     reading, spaced into words; particles は/を/へ as their own tokens
#              en       overrides the step's meaning for this variant
#              choices  overrides the answer choices; the first one is correct
#   replies  what you can say back: {ja, kana, en}
#   note     optional tip shown after the answer

lang: ja
title: Konbini Ears
subtitle: Hear what people in Japan say to you, at full speed, and answer without freezing.

# Kokoro voices (speech-kit). Staff lines are recorded in every staff voice; your lines in one.
voices:
  staff: [jf_alpha, jm_kumo]
  you: jm_kumo
speed: 1.0

scenes:

  # ── Konbini ──────────────────────────────────────────────────────────
  - id: konbini
    title: Konbini checkout
    blurb: Point card, bag, heating, chopsticks, paying. The same eight questions every time, asked fast.
    steps:
      - id: kb-greet
        en: "Welcome!"
        heard: "Often just the tail: \"…shaimase!\" shouted from the back."
        note: "No reply needed. A nod is plenty."
        say:
          - {ja: "いらっしゃいませ", kana: "いらっしゃいませ"}
          - {ja: "いらっしゃいませ、こんにちは", kana: "いらっしゃいませ、 こんにちは"}
      - id: kb-next
        p: 0.4
        en: "Next customer, please"
        key: "次 (tsugi) = next"
        say:
          - {ja: "次の方どうぞ", kana: "つぎ の かた どうぞ"}
          - {ja: "お次の方どうぞ", kana: "おつぎ の かた どうぞ"}
          - {ja: "こちらのレジへどうぞ", kana: "こちら の れじ へ どうぞ", en: "Come to this register, please", key: "レジ (reji) = register"}
      - id: kb-point
        p: 0.8
        en: "Do you have a point card?"
        key: "ポイントカード (pointo kaado) + お持ち (omochi) = do you have"
        heard: "\"pointokaado omochi desu ka\" runs together; listen for \"…omochi…\"."
        say:
          - {ja: "ポイントカードはお持ちですか", kana: "ぽいんとかーど は おもち です か"}
          - {ja: "ポイントカードございますか", kana: "ぽいんとかーど ございます か"}
          - {ja: "ポイントカードお持ちでしょうか", kana: "ぽいんとかーど おもち でしょう か"}
          - {ja: "ポイントカードかアプリはお持ちですか", kana: "ぽいんとかーど か あぷり は おもち です か", en: "Do you have a point card or the app?"}
        replies:
          - {ja: "持ってないです", kana: "もって ない です", en: "I don't have one"}
          - {ja: "大丈夫です", kana: "だいじょうぶ です", en: "No thanks (the all-purpose polite no)"}
      - id: kb-heat
        p: 0.6
        en: "Shall I heat this up?"
        key: "温め (atatame) = warming up"
        heard: "\"kochira atatame masu ka\" → \"atatamemaska\"."
        say:
          - {ja: "こちら温めますか", kana: "こちら あたため ます か"}
          - {ja: "お弁当温めますか", kana: "お べんとう あたため ます か"}
          - {ja: "温めはどうされますか", kana: "あたため は どう され ます か"}
        replies:
          - {ja: "はい、お願いします", kana: "はい、 おねがい します", en: "Yes, please"}
          - {ja: "大丈夫です", kana: "だいじょうぶ です", en: "No thanks"}
      - id: kb-hashi
        p: 0.6
        en: "Do you want chopsticks?"
        key: "お箸 (ohashi) = chopsticks; 膳 (zen) counts pairs"
        say:
          - {ja: "お箸はお付けしますか", kana: "お はし は おつけ します か"}
          - {ja: "お箸ご利用ですか", kana: "お はし ごりよう です か"}
          - {ja: "お箸は何膳お付けしますか", kana: "お はし は なんぜん おつけ します か", en: "How many pairs of chopsticks?"}
        replies:
          - {ja: "一膳お願いします", kana: "いちぜん おねがい します", en: "One pair, please"}
          - {ja: "二膳お願いします", kana: "にぜん おねがい します", en: "Two pairs, please"}
          - {ja: "大丈夫です", kana: "だいじょうぶ です", en: "No thanks"}
      - id: kb-spoon
        p: 0.3
        en: "Do you want a spoon?"
        key: "スプーン (supuun) = spoon"
        say:
          - {ja: "スプーンお付けしますか", kana: "すぷーん おつけ します か"}
          - {ja: "スプーンご利用ですか", kana: "すぷーん ごりよう です か"}
        replies:
          - {ja: "はい、お願いします", kana: "はい、 おねがい します", en: "Yes, please"}
          - {ja: "大丈夫です", kana: "だいじょうぶ です", en: "No thanks"}
      - id: kb-bag
        p: 0.9
        en: "Do you need a bag? (it costs a few yen)"
        key: "袋 (fukuro) = bag; レジ袋 (rejibukuro) = plastic bag"
        heard: "\"fukuro goriyou desu ka\" → \"fukuro goriyo-ska\". Catch \"fukuro\" and you've got it."
        say:
          - {ja: "袋はご利用ですか", kana: "ふくろ は ごりよう です か"}
          - {ja: "袋お付けしますか", kana: "ふくろ おつけ します か"}
          - {ja: "レジ袋はご利用ですか", kana: "れじぶくろ は ごりよう です か"}
          - {ja: "袋いりますか", kana: "ふくろ いります か"}
        replies:
          - {ja: "はい、お願いします", kana: "はい、 おねがい します", en: "Yes, please"}
          - {ja: "大丈夫です", kana: "だいじょうぶ です", en: "No thanks"}
          - {ja: "小さい袋でお願いします", kana: "ちいさい ふくろ で おねがい します", en: "A small bag, please"}
      - id: kb-split
        p: 0.3
        en: "Separate bags for the hot and cold things?"
        key: "分け (wake) = separate"
        say:
          - {ja: "袋お分けしますか", kana: "ふくろ おわけ します か"}
          - {ja: "温かいものと冷たいもの、袋分けますか", kana: "あたたかい もの と つめたい もの、 ふくろ わけ ます か"}
        replies:
          - {ja: "はい、お願いします", kana: "はい、 おねがい します", en: "Yes, please"}
          - {ja: "一緒で大丈夫です", kana: "いっしょ で だいじょうぶ です", en: "Together is fine"}
      - id: kb-age
        p: 0.2
        en: "Please tap the screen to confirm your age (alcohol, tobacco)"
        key: "画面 (gamen) = screen; 年齢確認 (nenrei kakunin) = age check"
        say:
          - {ja: "年齢確認のため、画面のタッチをお願いします", kana: "ねんれい かくにん の ため、 がめん の たっち を おねがい します"}
          - {ja: "年齢確認のボタンをお願いします", kana: "ねんれい かくにん の ぼたん を おねがい します"}
        note: "Tap はい on the customer screen. No reply needed."
      - id: kb-total
        en: "Your total is …"
        key: "円 (en) = yen; 合計 (goukei) / 全部で (zenbu de) = total"
        heard: "Numbers are where people freeze. Hundreds: …hyaku / …byaku / …pyaku."
        say:
          - {ja: "合計で842円です", kana: "ごうけい で はっぴゃく よんじゅう に えん です", choices: ["842 yen", "824 yen", "482 yen", "1,842 yen"]}
          - {ja: "全部で1280円になります", kana: "ぜんぶ で せん にひゃく はちじゅう えん に なります", choices: ["1,280 yen", "1,820 yen", "2,180 yen", "280 yen"]}
          - {ja: "530円でございます", kana: "ごひゃく さんじゅう えん で ございます", choices: ["530 yen", "350 yen", "513 yen", "5,300 yen"]}
          - {ja: "お会計、316円です", kana: "お かいけい、 さんびゃく じゅうろく えん です", choices: ["316 yen", "360 yen", "613 yen", "3,160 yen"]}
          - {ja: "合計で1,075円です", kana: "ごうけい で せん ななじゅうご えん です", choices: ["1,075 yen", "1,750 yen", "175 yen", "7,015 yen"]}
      - id: kb-pay
        p: 0.9
        en: "How will you pay?"
        key: "お支払い (oshiharai) = payment"
        heard: "\"oshiharai wa\" with a rising tone is the whole question."
        say:
          - {ja: "お支払い方法はどうされますか", kana: "お しはらい ほうほう は どう され ます か"}
          - {ja: "お支払いはいかがなさいますか", kana: "お しはらい は いかが なさい ます か"}
          - {ja: "お支払いは", kana: "お しはらい は"}
          - {ja: "お支払い方法を画面でお選びください", kana: "お しはらい ほうほう を がめん で お えらび ください", en: "Please choose how you'll pay on the screen"}
          - {ja: "お支払いはあちらの機械でお願いします", kana: "お しはらい は あちら の きかい で おねがい します", en: "Please pay at that machine over there"}
        replies:
          - {ja: "カードでお願いします", kana: "かーど で おねがい します", en: "By card, please"}
          - {ja: "現金で", kana: "げんきん で", en: "Cash"}
          - {ja: "Suicaでお願いします", kana: "すいか で おねがい します", en: "With Suica, please"}
      - id: kb-terminal
        p: 0.4
        en: "Tap your card or phone on the reader"
        key: "タッチ (tacchi) = tap; 差して (sashite) = insert"
        say:
          - {ja: "こちらにタッチをお願いします", kana: "こちら に たっち を おねがい します"}
          - {ja: "カードをお差しください", kana: "かーど を おさし ください", en: "Please insert your card"}
          - {ja: "暗証番号の入力をお願いします", kana: "あんしょう ばんごう の にゅうりょく を おねがい します", en: "Please enter your PIN"}
      - id: kb-change
        p: 0.5
        en: "Here's your change"
        key: "お預かり (oazukari) = I'm taking your money; お返し (okaeshi) = change back"
        say:
          - {ja: "1000円からお預かりします", kana: "せん えん から おあずかり します", en: "I'll take your 1,000 yen"}
          - {ja: "1000円お預かりします", kana: "せん えん おあずかり します", en: "I'll take your 1,000 yen"}
          - {ja: "158円のお返しです", kana: "ひゃく ごじゅう はち えん の おかえし です", en: "Your change is 158 yen", choices: ["Your change is 158 yen", "Your change is 185 yen", "Your total is 158 yen", "Your change is 1,058 yen"]}
          - {ja: "お先に大きい方、2000円のお返しです", kana: "お さき に おおきい ほう、 にせん えん の おかえし です", en: "First the bills: 2,000 yen back"}
      - id: kb-receipt
        p: 0.6
        en: "Do you want the receipt?"
        key: "レシート (reshiito) = receipt"
        say:
          - {ja: "レシートはご入用ですか", kana: "れしーと は ごいりよう です か"}
          - {ja: "レシートはよろしいですか", kana: "れしーと は よろしい です か", en: "You don't need the receipt, right?"}
          - {ja: "レシートご利用ですか", kana: "れしーと ごりよう です か"}
        replies:
          - {ja: "レシートください", kana: "れしーと ください", en: "The receipt, please"}
          - {ja: "大丈夫です", kana: "だいじょうぶ です", en: "No thanks"}
        note: "Trap: レシートはよろしいですか means \"you're fine without it?\", so はい means NO receipt. Saying レシートください always works."
      - id: kb-bye
        en: "Thank you!"
        heard: "\"arigatou gozaimashita\" → \"…zaimashta!\""
        say:
          - {ja: "ありがとうございました", kana: "ありがとう ございました"}
          - {ja: "ありがとうございました、またお越しくださいませ", kana: "ありがとう ございました、 また おこし くださいませ", en: "Thank you, please come again"}

  # ── Counter: fast food and cafés ─────────────────────────────────────
  - id: counter
    title: Fast food & café counter
    blurb: Eat in or take out, set or single, drink, size, hot or iced. Then wait for your number.
    steps:
      - id: ct-greet
        en: "Welcome, go ahead and order"
        key: "ご注文 (gochuumon) = order"
        say:
          - {ja: "いらっしゃいませ、ご注文をどうぞ", kana: "いらっしゃいませ、 ご ちゅうもん を どうぞ"}
          - {ja: "お決まりでしたらお伺いします", kana: "お きまり でしたら おうかがい します", en: "I'll take your order when you're ready"}
      - id: ct-eatin
        en: "For here or to go?"
        key: "店内 (tennai) = in the shop; お持ち帰り (omochikaeri) = take-out; お召し上がり (omeshiagari) = eating"
        heard: "\"tennai de omeshiagari desu ka\": \"omeshiagari\" is the giveaway."
        say:
          - {ja: "店内でお召し上がりですか", kana: "てんない で おめしあがり です か"}
          - {ja: "こちらでお召し上がりですか", kana: "こちら で おめしあがり です か"}
          - {ja: "店内ご利用ですか、お持ち帰りですか", kana: "てんない ごりよう です か、 おもちかえり です か"}
          - {ja: "お持ち帰りですか", kana: "おもちかえり です か"}
        replies:
          - {ja: "店内で", kana: "てんない で", en: "For here"}
          - {ja: "持ち帰りで", kana: "もちかえり で", en: "To go"}
      - id: ct-order
        kind: you
        en: "Order: this one, this one, and also this one."
        say:
          - {ja: "これとこれと、あとこれもお願いします", kana: "これ と これ と、 あと これ も おねがい します"}
        note: "Point at each one. と (to) = and; あと (ato) = and also; も (mo) = too."
      - id: ct-set
        p: 0.6
        en: "Would you like it as a set (meal)?"
        key: "セット (setto) = set meal; 単品 (tanpin) = item alone"
        say:
          - {ja: "セットになさいますか", kana: "せっと に なさい ます か"}
          - {ja: "セットでよろしいですか", kana: "せっと で よろしい です か"}
          - {ja: "単品でよろしいですか", kana: "たんぴん で よろしい です か", en: "Just the item on its own?"}
        replies:
          - {ja: "セットで", kana: "せっと で", en: "As a set"}
          - {ja: "単品で", kana: "たんぴん で", en: "Just the item"}
      - id: ct-drink
        p: 0.6
        en: "Would you like to add a drink?"
        key: "お飲み物 (onomimono) = drink; ご一緒に (goissho ni) = together with"
        heard: "\"goissho ni onomimono wa ikaga desu ka\" → \"…onomimono ikaga-ska\"."
        say:
          - {ja: "ご一緒にお飲み物はいかがですか", kana: "ご いっしょ に お のみもの は いかが です か"}
          - {ja: "お飲み物は何になさいますか", kana: "お のみもの は なに に なさい ます か", en: "Which drink would you like with the set?"}
          - {ja: "ドリンクはどうされますか", kana: "どりんく は どう され ます か", en: "Which drink would you like with the set?"}
        replies:
          - {ja: "大丈夫です", kana: "だいじょうぶ です", en: "No thanks"}
          - {ja: "ウーロン茶で", kana: "うーろんちゃ で", en: "Oolong tea"}
          - {ja: "コーラでお願いします", kana: "こーら で おねがい します", en: "A cola, please"}
      - id: ct-size
        p: 0.6
        en: "What size?"
        key: "サイズ (saizu) = size"
        say:
          - {ja: "サイズはいかがなさいますか", kana: "さいず は いかが なさい ます か"}
          - {ja: "サイズはどうされますか", kana: "さいず は どう され ます か"}
          - {ja: "Mサイズでよろしいですか", kana: "えむ さいず で よろしい です か", en: "Is medium OK?"}
        replies:
          - {ja: "Sで", kana: "えす で", en: "Small"}
          - {ja: "Mで", kana: "えむ で", en: "Medium"}
          - {ja: "Lでお願いします", kana: "える で おねがい します", en: "Large, please"}
      - id: ct-temp
        p: 0.5
        en: "Hot or iced?"
        key: "ホット (hotto) / アイス (aisu); 温かい (atatakai) / 冷たい (tsumetai)"
        say:
          - {ja: "ホットとアイス、どちらになさいますか", kana: "ほっと と あいす、 どちら に なさい ます か"}
          - {ja: "ホットでよろしいですか", kana: "ほっと で よろしい です か", en: "Is hot OK?"}
          - {ja: "温かいのと冷たいの、どちらにしますか", kana: "あたたかい の と つめたい の、 どちら に します か"}
        replies:
          - {ja: "ホットで", kana: "ほっと で", en: "Hot"}
          - {ja: "アイスで", kana: "あいす で", en: "Iced"}
      - id: ct-done
        p: 0.5
        en: "Will that be all?"
        key: "以上 (ijou) = that's all"
        say:
          - {ja: "ご注文は以上でよろしいですか", kana: "ご ちゅうもん は いじょう で よろしい です か"}
          - {ja: "以上でよろしいですか", kana: "いじょう で よろしい です か"}
        replies:
          - {ja: "はい", kana: "はい", en: "Yes"}
          - {ja: "あと、これもお願いします", kana: "あと、 これ も おねがい します", en: "And this too, please"}
      - id: ct-wait
        p: 0.6
        en: "We'll call your number. Please wait."
        key: "番号 (bangou) = number; お呼びします (oyobi shimasu) = we'll call"
        say:
          - {ja: "番号でお呼びしますので、少々お待ちください", kana: "ばんごう で およびします ので、 しょうしょう おまち ください"}
          - {ja: "お席までお持ちします", kana: "お せき まで おもち します", en: "We'll bring it to your seat"}
          - {ja: "出来上がりましたらお呼びします", kana: "できあがりましたら およびします", en: "We'll call you when it's ready"}

  # ── Restaurant / izakaya ─────────────────────────────────────────────
  - id: restaurant
    title: Restaurant & izakaya
    blurb: How many people, which seat, drinks first, ordering, clearing plates, paying.
    steps:
      - id: rs-count
        en: "How many people?"
        key: "何名様 (nanmei-sama) = how many people"
        heard: "\"nanmei-sama desu ka\" → \"nanmeisama-ska\". Holding up fingers works too."
        say:
          - {ja: "いらっしゃいませ、何名様ですか", kana: "いらっしゃいませ、 なんめいさま です か"}
          - {ja: "何名様でしょうか", kana: "なんめいさま でしょう か"}
          - {ja: "お一人様ですか", kana: "お ひとりさま です か", en: "Just one person?"}
          - {ja: "ご予約はされていますか", kana: "ご よやく は されて います か", en: "Do you have a reservation?"}
        replies:
          - {ja: "一人です", kana: "ひとり です", en: "One person"}
          - {ja: "二人です", kana: "ふたり です", en: "Two people"}
      - id: rs-smoke
        p: 0.1
        en: "Do you smoke?"
        key: "タバコ (tabako) = cigarettes; 吸う (suu) = smoke; 禁煙 (kin'en) = non-smoking"
        say:
          - {ja: "おタバコは吸われますか", kana: "お たばこ は すわれ ます か"}
          - {ja: "店内は全席禁煙となっております", kana: "てんない は ぜんせき きんえん と なって おります", en: "The whole place is non-smoking"}
        replies:
          - {ja: "吸わないです", kana: "すわない です", en: "I don't smoke"}
        note: "Since 2020 most restaurants are non-smoking inside. Say 吸わないです: 吸いません sounds just like すいません (excuse me)."
      - id: rs-wait
        p: 0.3
        en: "We're full. Can you wait?"
        key: "満席 (manseki) = full; お待ち (omachi) = waiting"
        say:
          - {ja: "ただいま満席でして、少々お待ちいただけますか", kana: "ただいま まんせき でして、 しょうしょう おまち いただけ ます か"}
          - {ja: "お名前を書いてお待ちください", kana: "お なまえ を かいて おまち ください", en: "Write your name and wait, please"}
        replies:
          - {ja: "はい、待ちます", kana: "はい、 まちます", en: "Yes, I'll wait"}
          - {ja: "どのくらい待ちますか", kana: "どの くらい まち ます か", en: "About how long is the wait?"}
      - id: rs-seat
        p: 0.8
        en: "I'll show you to your seat"
        key: "お席 (oseki) = your seat; ご案内 (goannai) = guiding"
        say:
          - {ja: "お席へご案内します", kana: "お せき へ ごあんない します"}
          - {ja: "こちらへどうぞ", kana: "こちら へ どうぞ", en: "This way, please"}
          - {ja: "カウンター席でもよろしいですか", kana: "かうんたーせき でも よろしい です か", en: "Is the counter OK?"}
          - {ja: "お水はセルフサービスです", kana: "お みず は せるふ さーびす です", en: "Water is self-service"}
        replies:
          - {ja: "はい、大丈夫です", kana: "はい、 だいじょうぶ です", en: "Yes, that's fine"}
      - id: rs-qr
        p: 0.4
        en: "Please order from the QR code / tablet"
        key: "QRコード (kyuuaaru koodo); タブレット (taburetto)"
        say:
          - {ja: "こちらのQRコードからご注文ください", kana: "こちら の きゅーあーる こーど から ご ちゅうもん ください"}
          - {ja: "ご注文はタブレットでお願いします", kana: "ご ちゅうもん は たぶれっと で おねがい します"}
      - id: rs-drinks
        p: 0.6
        en: "Have you decided on drinks?"
        key: "お飲み物 (onomimono) = drinks; 先に (saki ni) = first"
        say:
          - {ja: "お飲み物はお決まりですか", kana: "お のみもの は お きまり です か"}
          - {ja: "先にお飲み物お伺いします", kana: "さき に お のみもの おうかがい します", en: "Let me take your drink order first"}
        replies:
          - {ja: "生ビールをお願いします", kana: "なまびーる を おねがい します", en: "A draft beer, please"}
          - {ja: "お水で大丈夫です", kana: "お みず で だいじょうぶ です", en: "Water is fine"}
      - id: rs-otoshi
        p: 0.4
        en: "This is your otōshi (a small starter that comes with the table charge)"
        key: "お通し (otooshi) = the starter you didn't order"
        say:
          - {ja: "こちらお通しです", kana: "こちら おとおし です"}
        note: "Izakaya serve it automatically and add a few hundred yen per person. It's normal, not a mistake."
      - id: rs-order
        p: 0.8
        en: "Are you ready to order?"
        key: "お決まり (okimari) = decided"
        heard: "\"gochuumon wa okimari desu ka\" → \"…okimari-ska\"."
        say:
          - {ja: "ご注文はお決まりですか", kana: "ご ちゅうもん は お きまり です か"}
          - {ja: "ご注文お伺いします", kana: "ご ちゅうもん おうかがい します", en: "May I take your order?"}
          - {ja: "お決まりになりましたらお呼びください", kana: "お きまり に なりましたら およびください", en: "Call me when you've decided"}
        replies:
          - {ja: "もう少し待ってもらえますか", kana: "もう すこし まって もらえ ます か", en: "Could I have a little more time?"}
          - {ja: "おすすめは何ですか", kana: "おすすめ は なん です か", en: "What do you recommend?"}
      - id: rs-ask
        kind: you
        en: "Ask: is this one good? Which one is the most popular?"
        say:
          - {ja: "これはおすすめですか", kana: "これ は おすすめ です か"}
          - {ja: "一番人気はどれですか", kana: "いちばん にんき は どれ です か"}
      - id: rs-reco
        p: 0.5
        en: "This is the most popular one"
        key: "人気 (ninki) = popular; おすすめ (osusume) = recommended"
        say:
          - {ja: "こちらが一番人気です", kana: "こちら が いちばん にんき です"}
          - {ja: "本日のおすすめはこちらです", kana: "ほんじつ の おすすめ は こちら です", en: "Today's special is this one"}
          - {ja: "少し辛いですよ", kana: "すこし からい です よ", en: "It's a little spicy"}
      - id: rs-last
        p: 0.3
        en: "It's last order. Anything else?"
        key: "ラストオーダー (rasuto oodaa)"
        say:
          - {ja: "ラストオーダーになりますが、ご注文はよろしいですか", kana: "らすと おーだー に なります が、 ご ちゅうもん は よろしい です か"}
        replies:
          - {ja: "大丈夫です", kana: "だいじょうぶ です", en: "We're fine"}
          - {ja: "これもお願いします", kana: "これ も おねがい します", en: "This too, please"}
      - id: rs-clear
        p: 0.5
        en: "May I take your plate?"
        key: "お下げ (osage) = clearing away; お済み (osumi) = finished"
        say:
          - {ja: "お下げしてもよろしいですか", kana: "おさげ して も よろしい です か"}
          - {ja: "こちらお済みですか", kana: "こちら おすみ です か", en: "Are you finished with this?"}
          - {ja: "お皿お下げしますね", kana: "お さら おさげ します ね"}
        replies:
          - {ja: "はい、どうぞ", kana: "はい、 どうぞ", en: "Yes, go ahead"}
          - {ja: "まだです", kana: "まだ です", en: "Not yet"}
      - id: rs-check
        p: 0.8
        en: "Please pay at the register"
        key: "お会計 (okaikei) = the bill; レジ (reji) = register"
        say:
          - {ja: "お会計はレジでお願いします", kana: "お かいけい は れじ で おねがい します"}
          - {ja: "お会計はご一緒でよろしいですか", kana: "お かいけい は ご いっしょ で よろしい です か", en: "Paying together?"}
          - {ja: "お会計は別々ですか", kana: "お かいけい は べつべつ です か", en: "Separate checks?"}
        replies:
          - {ja: "一緒で", kana: "いっしょ で", en: "Together"}
          - {ja: "別々で", kana: "べつべつ で", en: "Separately"}
      - id: rs-bye
        en: "Thank you!"
        say:
          - {ja: "ありがとうございました、またお越しくださいませ", kana: "ありがとう ございました、 また おこし くださいませ", en: "Thank you, please come again"}
          - {ja: "ありがとうございました", kana: "ありがとう ございました"}
        replies:
          - {ja: "ごちそうさまでした", kana: "ごちそうさま でした", en: "Thanks for the meal"}

  # ── Ramen ────────────────────────────────────────────────────────────
  - id: ramen
    title: Ramen shop
    blurb: Ticket machine first, then noodle firmness, richness, oil, garlic. Shouted over a kitchen.
    steps:
      - id: rm-greet
        en: "Welcome!"
        heard: "Shouted and clipped: \"rasshai!\" Every cook joins in."
        say:
          - {ja: "いらっしゃいませ", kana: "いらっしゃいませ"}
          - {ja: "らっしゃい", kana: "らっしゃい"}
      - id: rm-ticket
        p: 0.8
        en: "Buy a meal ticket first, please"
        key: "食券 (shokken) = meal ticket"
        say:
          - {ja: "先に食券をお願いします", kana: "さき に しょっけん を おねがい します"}
          - {ja: "食券を買ってからお座りください", kana: "しょっけん を かって から おすわり ください"}
          - {ja: "食券お預かりします", kana: "しょっけん おあずかり します", en: "I'll take your ticket"}
      - id: rm-firm
        p: 0.7
        en: "How firm do you want the noodles?"
        key: "麺 (men) = noodles; 固さ (katasa) = firmness"
        say:
          - {ja: "麺の固さはどうしますか", kana: "めん の かたさ は どう します か"}
          - {ja: "麺の固さ、普通でよろしいですか", kana: "めん の かたさ、 ふつう で よろしい です か", en: "Regular firmness OK?"}
          - {ja: "麺の固さはいかがなさいますか", kana: "めん の かたさ は いかが なさい ます か"}
          - {ja: "お好みはございますか", kana: "お このみ は ございます か", en: "Any preferences? (firmness, richness, oil)"}
        replies:
          - {ja: "普通で", kana: "ふつう で", en: "Regular"}
          - {ja: "固めで", kana: "かため で", en: "Firm"}
          - {ja: "柔らかめで", kana: "やわらかめ で", en: "Soft"}
      - id: rm-rich
        p: 0.5
        en: "How strong do you want the flavor?"
        key: "味 (aji) = flavor; 濃さ (kosa) = strength; 油 (abura) = oil"
        say:
          - {ja: "味の濃さはどうしますか", kana: "あじ の こさ は どう します か"}
          - {ja: "油の量はどうしますか", kana: "あぶら の りょう は どう します か", en: "How much oil?"}
        replies:
          - {ja: "普通で", kana: "ふつう で", en: "Regular"}
          - {ja: "薄めで", kana: "うすめ で", en: "Lighter"}
          - {ja: "濃いめで", kana: "こいめ で", en: "Stronger"}
          - {ja: "油少なめで", kana: "あぶら すくなめ で", en: "Less oil"}
      - id: rm-garlic
        p: 0.4
        en: "Do you want garlic?"
        key: "ニンニク (ninniku) = garlic"
        say:
          - {ja: "ニンニク入れますか", kana: "にんにく いれ ます か"}
          - {ja: "トッピングはどうしますか", kana: "とっぴんぐ は どう します か", en: "Any toppings?"}
        replies:
          - {ja: "お願いします", kana: "おねがい します", en: "Yes, please"}
          - {ja: "なしで", kana: "なし で", en: "None"}
      - id: rm-refill
        p: 0.3
        en: "A noodle refill? How firm?"
        key: "替え玉 (kaedama) = extra noodles; おかわり (okawari) = refill"
        say:
          - {ja: "替え玉ですね、固さはどうしますか", kana: "かえだま です ね、 かたさ は どう します か"}
          - {ja: "ライスはおかわり自由です", kana: "らいす は おかわり じゆう です", en: "Rice refills are free"}
        replies:
          - {ja: "普通で", kana: "ふつう で", en: "Regular"}
          - {ja: "固めで", kana: "かため で", en: "Firm"}
        note: "Staff rarely offer a refill. You call out 替え玉ください (kaedama kudasai), and they confirm."
      - id: rm-serve
        p: 0.6
        en: "Here's your order. It's hot, careful."
        key: "お待たせしました (omatase shimashita) = sorry to keep you waiting; 熱い (atsui) = hot"
        say:
          - {ja: "お待たせしました、熱いのでお気をつけください", kana: "おまたせ しました、 あつい ので お きをつけ ください"}
          - {ja: "お待たせしました", kana: "おまたせ しました", en: "Here's your order (sorry for the wait)"}
      - id: rm-bye
        en: "Thank you!"
        say:
          - {ja: "ありがとうございました", kana: "ありがとう ございました"}
        replies:
          - {ja: "ごちそうさまでした", kana: "ごちそうさま でした", en: "Thanks for the meal"}

  # ── Shops & drugstores ───────────────────────────────────────────────
  - id: shop
    title: Shops & drugstores
    blurb: Just looking, out of stock, tax-free, gift or for yourself, and the bag that costs extra.
    steps:
      - id: sh-greet
        en: "Welcome, have a look around"
        key: "ご覧ください (goran kudasai) = please look"
        say:
          - {ja: "いらっしゃいませ、どうぞご覧ください", kana: "いらっしゃいませ、 どうぞ ごらん ください"}
          - {ja: "いらっしゃいませ", kana: "いらっしゃいませ", en: "Welcome!"}
      - id: sh-help
        p: 0.6
        en: "Are you looking for something?"
        key: "お探し (osagashi) = searching"
        say:
          - {ja: "何かお探しですか", kana: "なにか おさがし です か"}
          - {ja: "何かございましたらお声がけください", kana: "なにか ございましたら お こえがけ ください", en: "Let me know if you need anything"}
        replies:
          - {ja: "見ているだけです", kana: "みて いる だけ です", en: "Just looking"}
          - {ja: "これはありますか", kana: "これ は あります か", en: "Do you have this? (show a photo)"}
      - id: sh-stock
        p: 0.3
        en: "Sorry, we're out of stock"
        key: "在庫 (zaiko) = stock; 切らして (kirashite) = run out"
        say:
          - {ja: "申し訳ございません、ただいま在庫を切らしております", kana: "もうしわけ ございません、 ただいま ざいこ を きらして おります"}
          - {ja: "在庫を確認してきます", kana: "ざいこ を かくにん して きます", en: "I'll go check the stock"}
      - id: sh-try
        p: 0.3
        en: "Would you like to try it on?"
        key: "試着 (shichaku) = trying on"
        say:
          - {ja: "ご試着なさいますか", kana: "ご しちゃく なさい ます か"}
          - {ja: "試着室はこちらです", kana: "しちゃくしつ は こちら です", en: "The fitting room is over here"}
        replies:
          - {ja: "はい、お願いします", kana: "はい、 おねがい します", en: "Yes, please"}
          - {ja: "大丈夫です", kana: "だいじょうぶ です", en: "No thanks"}
      - id: sh-taxfree
        p: 0.6
        en: "Would you like it tax-free?"
        key: "免税 (menzei) = tax-free; パスポート (pasupooto)"
        say:
          - {ja: "免税をご希望ですか", kana: "めんぜい を ごきぼう です か"}
          - {ja: "パスポートはお持ちですか", kana: "ぱすぽーと は おもち です か", en: "Do you have your passport? (for tax-free)"}
          - {ja: "お支払い回数は一括でよろしいですか", kana: "お しはらい かいすう は いっかつ で よろしい です か", en: "Paying in one go (no installments)?"}
          - {ja: "免税は5000円以上からになります", kana: "めんぜい は ごせん えん いじょう から に なります", en: "Tax-free starts at 5,000 yen", choices: ["Tax-free starts at 5,000 yen", "Tax-free starts at 500 yen", "Tax-free starts at 50,000 yen", "Tax-free is not available"]}
        replies:
          - {ja: "はい、お願いします", kana: "はい、 おねがい します", en: "Yes, please"}
          - {ja: "パスポートです", kana: "ぱすぽーと です", en: "Here's my passport"}
        note: "From 1 Nov 2026 tax-free becomes a refund: you pay the tax at the till and get it back at airport customs. Keep the receipt and the goods unopened. For 一括 (one payment), just say はい."
      - id: sh-gift
        p: 0.3
        en: "Is this a gift?"
        key: "プレゼント用 (purezento-you) = for a gift; ご自宅用 (gojitaku-you) = for home"
        say:
          - {ja: "プレゼント用ですか", kana: "ぷれぜんと よう です か"}
          - {ja: "ご自宅用でよろしいですか", kana: "ご じたく よう で よろしい です か", en: "For yourself (no gift wrap)?"}
        replies:
          - {ja: "自分用です", kana: "じぶん よう です", en: "It's for me"}
          - {ja: "プレゼント用です", kana: "ぷれぜんと よう です", en: "It's a gift"}
      - id: sh-bag
        p: 0.5
        en: "Bags cost extra. Is that OK? (asks you to agree to pay)"
        key: "有料 (yuuryou) = costs money; 紙袋 (kamibukuro) = paper bag"
        say:
          - {ja: "袋は有料ですがよろしいですか", kana: "ふくろ は ゆうりょう です が よろしい です か"}
          - {ja: "紙袋にお入れしますか", kana: "かみぶくろ に おいれ します か", en: "Shall I put it in a paper bag?"}
        replies:
          - {ja: "はい、お願いします", kana: "はい、 おねがい します", en: "Yes, please"}
          - {ja: "袋はいらないです", kana: "ふくろ は いらない です", en: "No bag, thanks"}
        note: "大丈夫です is risky here: after \"is that OK?\" it can mean \"fine, I'll pay\". 袋はいらないです is clear."
      - id: sh-bye
        en: "Thank you!"
        say:
          - {ja: "ありがとうございました", kana: "ありがとう ございました"}
          - {ja: "ありがとうございました、またお越しくださいませ", kana: "ありがとう ございました、 また おこし くださいませ", en: "Thank you, please come again"}

  # ── Hotel ────────────────────────────────────────────────────────────
  - id: hotel
    title: Hotel front desk
    blurb: Checking in, your name, the passport, the form, breakfast times, luggage.
    steps:
      - id: ht-checkin
        en: "Welcome. Checking in?"
        key: "チェックイン (chekkuin)"
        say:
          - {ja: "いらっしゃいませ、チェックインでしょうか", kana: "いらっしゃいませ、 ちぇっくいん でしょう か"}
          - {ja: "チェックインですか", kana: "ちぇっくいん です か"}
        replies:
          - {ja: "はい、予約しています", kana: "はい、 よやく して います", en: "Yes, I have a reservation"}
      - id: ht-name
        en: "May I have your name?"
        key: "お名前 (onamae) = your name"
        say:
          - {ja: "お名前をお伺いしてもよろしいですか", kana: "お なまえ を おうかがい して も よろしい です か"}
          - {ja: "ご予約のお名前をお願いします", kana: "ご よやく の お なまえ を おねがい します"}
      - id: ht-passport
        p: 0.8
        en: "May I see your passport? (hotel check-in)"
        key: "拝見 (haiken) = (humbly) see"
        say:
          - {ja: "パスポートを拝見してもよろしいですか", kana: "ぱすぽーと を はいけん して も よろしい です か"}
          - {ja: "パスポートのコピーを取らせていただきます", kana: "ぱすぽーと の こぴー を とらせて いただきます", en: "I'll make a copy of your passport"}
      - id: ht-form
        p: 0.6
        en: "Please fill this out"
        key: "ご記入 (gokinyuu) = filling in"
        say:
          - {ja: "こちらにご記入をお願いします", kana: "こちら に ごきにゅう を おねがい します"}
          - {ja: "こちらにサインをお願いします", kana: "こちら に さいん を おねがい します", en: "Please sign here"}
      - id: ht-breakfast
        p: 0.6
        en: "Breakfast is from 7 to 10, on the 2nd floor"
        key: "朝食 (choushoku) = breakfast; 階 (kai) = floor"
        say:
          - {ja: "朝食は7時から10時まで、2階のレストランです", kana: "ちょうしょく は しちじ から じゅうじ まで、 にかい の れすとらん です", choices: ["Breakfast is 7–10, 2nd floor", "Breakfast is 7–10, 7th floor", "Breakfast is 2–10, 7th floor", "Check-out is at 10"]}
          - {ja: "チェックアウトは11時です", kana: "ちぇっくあうと は じゅういちじ です", en: "Check-out is at 11", choices: ["Check-out is at 11", "Check-out is at 7", "Check-in is at 11", "Breakfast is at 11"]}
          - {ja: "チェックインは15時からになります", kana: "ちぇっくいん は じゅうごじ から に なります", en: "Check-in is from 3 p.m.", choices: ["Check-in is from 3 p.m.", "Check-in is from 5 p.m.", "Check-out is at 3 p.m.", "Check-in is from 1 p.m."]}
      - id: ht-luggage
        p: 0.4
        en: "Shall I hold your luggage?"
        key: "お荷物 (onimotsu) = luggage; お預かり (oazukari) = holding"
        say:
          - {ja: "お荷物お預かりしましょうか", kana: "お にもつ おあずかり しましょう か"}
        replies:
          - {ja: "お願いします", kana: "おねがい します", en: "Yes, please"}
      - id: ht-key
        en: "Here's your room key"
        key: "鍵 (kagi) = key; お部屋 (oheya) = room"
        say:
          - {ja: "こちらがお部屋の鍵です", kana: "こちら が お へや の かぎ です"}
          - {ja: "お部屋は5階の512号室です", kana: "お へや は ごかい の ごひゃく じゅうに ごうしつ です", en: "Your room is 512, on the 5th floor", choices: ["Room 512, 5th floor", "Room 521, 5th floor", "Room 512, 2nd floor", "Room 215, 5th floor"]}

  # ── Train station ────────────────────────────────────────────────────
  - id: station
    title: Train station
    blurb: Platform announcements, where the train is going, the gate that beeps, and the ticket window.
    steps:
      - id: st-arrive
        en: "A train is arriving soon"
        key: "まもなく (mamonaku) = shortly; 参ります (mairimasu) = is coming"
        heard: "It starts \"mamonaku…\" and the rest trails off. That one word means step back and get ready."
        say:
          - {ja: "まもなく電車が参ります", kana: "まもなく でんしゃ が まいります"}
          - {ja: "まもなく2番線に電車が参ります", kana: "まもなく にばんせん に でんしゃ が まいります", en: "A train is arriving at platform 2 soon", choices: ["A train is arriving at platform 2 soon", "A train is arriving at platform 12 soon", "The train at platform 2 has just left", "Platform 2 is closed"]}
      - id: st-line
        p: 0.7
        en: "Please stand back behind the yellow line"
        key: "黄色い線 (kiiroi sen) = yellow line; お下がりください (osagari kudasai) = please step back"
        say:
          - {ja: "危ないですから黄色い線の内側までお下がりください", kana: "あぶない です から きいろい せん の うちがわ まで おさがり ください"}
          - {ja: "黄色い点字ブロックまでお下がりください", kana: "きいろい てんじ ぶろっく まで おさがり ください"}
      - id: st-bound
        p: 0.8
        en: "This train is bound for Tokyo"
        key: "行き (yuki) = bound for. 次は (tsugi wa) would mean the next stop instead"
        heard: "\"toukyou-yuki desu\". Listen for \"yuki\" right after the place name."
        say:
          - {ja: "この電車は東京行きです", kana: "この でんしゃ は とうきょう ゆき です", choices: ["This train goes to Tokyo", "The next stop is Tokyo", "Change here for Tokyo", "This train came from Tokyo"]}
          - {ja: "この電車は各駅停車、新宿行きです", kana: "この でんしゃ は かくえき ていしゃ、 しんじゅく ゆき です", en: "A local train (stops everywhere), bound for Shinjuku", choices: ["A local to Shinjuku, stopping everywhere", "An express to Shinjuku, few stops", "The next stop is Shinjuku", "Change at Shinjuku"]}
      - id: st-next
        p: 0.8
        en: "The next stop is Shibuya"
        key: "次は (tsugi wa) = next is; the name is said twice"
        say:
          - {ja: "次は渋谷、渋谷です", kana: "つぎ は しぶや、 しぶや です", choices: ["The next stop is Shibuya", "This train goes to Shibuya", "We are now at Shibuya", "Change at Shibuya"]}
          - {ja: "まもなく渋谷です", kana: "まもなく しぶや です", en: "Arriving at Shibuya shortly", choices: ["Arriving at Shibuya shortly", "This train goes to Shibuya", "Shibuya is two stops away", "Shibuya was the last stop"]}
      - id: st-transfer
        p: 0.6
        en: "Change here for the Yamanote Line"
        key: "乗り換え (norikae) = transfer"
        say:
          - {ja: "山手線はお乗り換えです", kana: "やまのてせん は おのりかえ です"}
          - {ja: "地下鉄線はお乗り換えください", kana: "ちかてつせん は おのりかえ ください", en: "Change here for the subway"}
      - id: st-doors
        p: 0.6
        en: "The doors on the left will open"
        key: "出口 (deguchi) = exit; 左側 (hidarigawa) = left side; 右側 (migigawa) = right side"
        say:
          - {ja: "お出口は左側です", kana: "お でぐち は ひだりがわ です", choices: ["Doors open on the left", "Doors open on the right", "The exit is upstairs", "Doors are closing"]}
          - {ja: "お出口は右側です", kana: "お でぐち は みぎがわ です", en: "The doors on the right will open", choices: ["Doors open on the right", "Doors open on the left", "The exit is upstairs", "Doors are closing"]}
          - {ja: "ドアが閉まります、ご注意ください", kana: "どあ が しまります、 ご ちゅうい ください", en: "The doors are closing, careful"}
      - id: st-skip
        p: 0.4
        en: "This express does not stop at Ebisu"
        key: "止まりません (tomarimasen) = doesn't stop; 急行 (kyuukou) = express"
        say:
          - {ja: "この電車は恵比寿には止まりません", kana: "この でんしゃ は えびす に は とまりません", en: "This train does not stop at Ebisu"}
          - {ja: "急行は恵比寿には止まりません", kana: "きゅうこう は えびす に は とまりません"}
        note: "If you need a small station, take the 各駅停車 (kakueki teisha), the local that stops everywhere."
      - id: st-delay
        p: 0.4
        en: "Trains are delayed because of an accident"
        key: "遅れ (okure) = delay; 影響 (eikyou) = effect of; 見合わせ (miawase) = suspended"
        say:
          - {ja: "人身事故の影響で、電車に遅れが出ております", kana: "じんしん じこ の えいきょう で、 でんしゃ に おくれ が でて おります"}
          - {ja: "ただいま運転を見合わせております", kana: "ただいま うんてん を みあわせて おります", en: "Service is suspended right now"}
        note: "見合わせ means nothing is running. Check another line or ask the station staff for a 振替 (furikae), a ticket you can use on another line."
      - id: st-gate
        p: 0.5
        en: "Not enough money on the card. Please top it up."
        key: "残高 (zandaka) = balance; 不足 (fusoku) = short; チャージ (chaaji) = top up"
        heard: "The gate's own voice, with a beep and the flaps shutting."
        say:
          - {ja: "残高が不足しています、チャージしてください", kana: "ざんだか が ふそく して います、 ちゃーじ して ください"}
          - {ja: "精算機で精算してください", kana: "せいさんき で せいさん して ください", en: "Pay the difference at the fare adjustment machine"}
        note: "The 精算機 (seisanki) is the yellow-labelled machine just before the gates. Tap your card on it and pay the shortfall."
      - id: st-window
        p: 0.5
        en: "Where are you travelling to? (ticket window)"
        key: "どちら (dochira) = where; 切符 (kippu) = ticket"
        say:
          - {ja: "どちらまでの切符ですか", kana: "どちら まで の きっぷ です か"}
          - {ja: "何名様ですか、大人の方だけですか", kana: "なんめいさま です か、 おとな の かた だけ です か", en: "How many? Adults only?"}
        replies:
          - {ja: "京都まで、大人一枚お願いします", kana: "きょうと まで、 おとな いちまい おねがい します", en: "To Kyoto, one adult, please"}
          - {ja: "大人二枚です", kana: "おとな にまい です", en: "Two adults"}
      - id: st-seat
        p: 0.5
        en: "Reserved or non-reserved seat?"
        key: "指定席 (shiteiseki) = reserved; 自由席 (jiyuuseki) = non-reserved"
        say:
          - {ja: "指定席と自由席、どちらになさいますか", kana: "していせき と じゆうせき、 どちら に なさい ます か"}
          - {ja: "窓側と通路側、どちらがよろしいですか", kana: "まどがわ と つうろがわ、 どちら が よろしい です か", en: "Window or aisle?"}
        replies:
          - {ja: "指定席でお願いします", kana: "していせき で おねがい します", en: "Reserved, please"}
          - {ja: "自由席で", kana: "じゆうせき で", en: "Non-reserved"}
          - {ja: "窓側で", kana: "まどがわ で", en: "Window"}
          - {ja: "通路側で", kana: "つうろがわ で", en: "Aisle"}
      - {id: st-ask-stop, kind: you, en: "Does this train stop at Kyoto?", say: [{ja: "この電車は京都に止まりますか", kana: "この でんしゃ は きょうと に とまります か"}]}
      - {id: st-ask-platform, kind: you, en: "Which platform for the train to Kyoto?", say: [{ja: "京都行きは何番線ですか", kana: "きょうと ゆき は なんばんせん です か"}]}

  # ── Taxi ─────────────────────────────────────────────────────────────
  - id: taxi
    title: Taxi
    blurb: Where to, the expressway question, "around here OK?", and paying. The door opens by itself.
    steps:
      - id: tx-where
        en: "Where to?"
        key: "どちら (dochira) = where; まで (made) = up to"
        heard: "Often just \"dochira made?\" over the shoulder."
        say:
          - {ja: "どちらまでですか", kana: "どちら まで です か"}
          - {ja: "どちらまで行かれますか", kana: "どちら まで いかれ ます か"}
          - {ja: "どちらまでお送りしましょうか", kana: "どちら まで おおくり しましょう か"}
        replies:
          - {ja: "この住所までお願いします", kana: "この じゅうしょ まで おねがい します", en: "To this address, please (show your phone)"}
          - {ja: "東京駅までお願いします", kana: "とうきょう えき まで おねがい します", en: "To Tokyo Station, please"}
        note: "Show the address or the map pin on your phone. Drivers read the Japanese address better than a place name."
      - id: tx-belt
        p: 0.5
        en: "Please fasten your seat belt"
        key: "シートベルト (shiito beruto); お締め (oshime) = fasten"
        say:
          - {ja: "シートベルトをお締めください", kana: "しーと べると を おしめ ください"}
          - {ja: "後ろの席もシートベルトをお願いします", kana: "うしろ の せき も しーと べると を おねがい します"}
      - id: tx-highway
        p: 0.4
        en: "Is it OK to take the expressway? (it costs more)"
        key: "高速 (kousoku) = expressway; 下の道 (shita no michi) = ordinary roads"
        say:
          - {ja: "高速を使ってもよろしいですか", kana: "こうそく を つかって も よろしい です か"}
          - {ja: "高速料金がかかりますが、よろしいですか", kana: "こうそく りょうきん が かかります が、 よろしい です か", en: "There's an expressway toll. Is that OK?"}
        replies:
          - {ja: "はい、お願いします", kana: "はい、 おねがい します", en: "Yes, please"}
          - {ja: "下の道でお願いします", kana: "した の みち で おねがい します", en: "Ordinary roads, please"}
      - id: tx-here
        p: 0.8
        en: "Is around here OK?"
        key: "この辺 (kono hen) = around here"
        say:
          - {ja: "この辺りでよろしいですか", kana: "この あたり で よろしい です か"}
          - {ja: "こちらでよろしいですか", kana: "こちら で よろしい です か"}
          - {ja: "入口の前までつけますか", kana: "いりぐち の まえ まで つけ ます か", en: "Shall I pull up right at the entrance?"}
        replies:
          - {ja: "ここで大丈夫です", kana: "ここ で だいじょうぶ です", en: "Here is fine"}
          - {ja: "もう少し先までお願いします", kana: "もう すこし さき まで おねがい します", en: "A little further, please"}
      - id: tx-fare
        p: 0.9
        en: "That's 1,280 yen"
        key: "〜円になります (…en ni narimasu) = that comes to"
        heard: "Numbers go fast. If you lose it, the meter shows the same figure."
        say:
          - {ja: "1280円になります", kana: "せん にひゃく はちじゅう えん に なります", choices: ["1,280 yen", "1,820 yen", "2,180 yen", "1,208 yen"]}
          - {ja: "3450円です", kana: "さんぜん よんひゃく ごじゅう えん です", en: "That's 3,450 yen", choices: ["3,450 yen", "3,540 yen", "4,350 yen", "3,405 yen"]}
      - id: tx-pay
        p: 0.7
        en: "How would you like to pay?"
        key: "お支払い (oshiharai) = payment; 現金 (genkin) = cash"
        say:
          - {ja: "お支払いはどうされますか", kana: "お しはらい は どう され ます か"}
          - {ja: "カードでよろしいですか", kana: "かーど で よろしい です か", en: "By card, is that right?"}
        replies:
          - {ja: "カードで", kana: "かーど で", en: "By card"}
          - {ja: "現金で", kana: "げんきん で", en: "Cash"}
          - {ja: "交通系ICで", kana: "こうつうけい あいしー で", en: "With my IC transit card"}
      - id: tx-receipt
        p: 0.5
        en: "Do you need a receipt? (taxi)"
        key: "領収書 (ryoushuusho) = receipt"
        say:
          - {ja: "領収書はご利用ですか", kana: "りょうしゅうしょ は ごりよう です か"}
          - {ja: "領収書いりますか", kana: "りょうしゅうしょ いります か"}
        replies:
          - {ja: "はい、お願いします", kana: "はい、 おねがい します", en: "Yes, please"}
          - {ja: "大丈夫です", kana: "だいじょうぶ です", en: "No thanks"}
      - id: tx-door
        p: 0.6
        en: "The door opens by itself, careful"
        key: "ドア (doa); 開きます (akimasu) = opens"
        say:
          - {ja: "ドアが開きますのでお気をつけください", kana: "どあ が あきます ので お きをつけ ください"}
          - {ja: "お忘れ物のないようお気をつけください", kana: "お わすれもの の ない よう お きをつけ ください", en: "Mind you don't leave anything behind"}
        note: "Don't open or shut the back door yourself; the driver works it."
      - {id: tx-ask-here, kind: you, en: "Please stop here.", say: [{ja: "ここで止めてください", kana: "ここ で とめて ください"}]}
      - {id: tx-ask-time, kind: you, en: "About how long will it take?", say: [{ja: "どのくらいかかりますか", kana: "どの くらい かかります か"}]}

  # ── Asking directions ────────────────────────────────────────────────
  - id: directions
    title: Asking the way
    blurb: You ask a passer-by. They answer with straight on, the second light, left, five minutes, and "shall I walk you?"
    steps:
      - {id: dr-ask, kind: you, en: "Excuse me, where is the station?", say: [{ja: "すみません、駅はどこですか", kana: "すみません、 えき は どこ です か"}]}
      - id: dr-straight
        en: "Go straight along this road"
        key: "まっすぐ (massugu) = straight; 道 (michi) = road"
        say:
          - {ja: "この道をまっすぐ行ってください", kana: "この みち を まっすぐ いって ください"}
          - {ja: "このまままっすぐです", kana: "この まま まっすぐ です", en: "Just keep going straight"}
      - id: dr-turn
        p: 0.8
        en: "Turn right at the second traffic light"
        key: "信号 (shingou) = traffic light; 右 (migi) = right; 左 (hidari) = left; 曲がる (magaru) = turn"
        heard: "\"futatsume no shingou o migi\". Often just the noun and the side, no verb."
        say:
          - {ja: "二つ目の信号を右に曲がってください", kana: "ふたつめ の しんごう を みぎ に まがって ください", choices: ["Right at the second light", "Left at the second light", "Right at the first light", "Straight past two lights"]}
          - {ja: "あの角を左です", kana: "あの かど を ひだり です", en: "Left at that corner", choices: ["Left at that corner", "Right at that corner", "Left at the light", "It's on that corner"]}
          - {ja: "突き当たりを右です", kana: "つきあたり を みぎ です", en: "Right at the end of the road", choices: ["Right at the end of the road", "Left at the end of the road", "Right at the next corner", "It's at the end of the road"]}
      - id: dr-landmark
        p: 0.6
        en: "There's a konbini on your right"
        key: "右手 (migite) = right-hand side; 左手 (hidarite) = left-hand side"
        say:
          - {ja: "右手にコンビニがあります", kana: "みぎて に こんびに が あります", choices: ["A konbini on your right", "A konbini on your left", "Turn right at the konbini", "It's inside the konbini"]}
          - {ja: "左手に見えてきます", kana: "ひだりて に みえて きます", en: "You'll see it on your left", choices: ["You'll see it on your left", "You'll see it on your right", "Turn left and look", "You can't see it from here"]}
      - id: dr-there
        p: 0.5
        en: "It's that building you can see over there"
        key: "あそこ (asoko) = over there; ビル (biru) = building"
        say:
          - {ja: "あそこに見えるビルです", kana: "あそこ に みえる びる です"}
          - {ja: "あの白いビルの二階です", kana: "あの しろい びる の にかい です", en: "2nd floor of that white building", choices: ["2nd floor of the white building", "12th floor of the white building", "2nd floor of the red building", "Behind the white building"]}
      - id: dr-time
        p: 0.7
        en: "About five minutes on foot"
        key: "歩いて (aruite) = on foot; くらい (kurai) = about"
        say:
          - {ja: "歩いて5分くらいです", kana: "あるいて ごふん くらい です", choices: ["About 5 minutes on foot", "About 15 minutes on foot", "About 5 minutes by train", "5 stations away"]}
          - {ja: "ちょっと遠いですね、電車の方がいいですよ", kana: "ちょっと とおい です ね、 でんしゃ の ほう が いい です よ", en: "It's a bit far. The train is better."}
      - id: dr-dunno
        p: 0.4
        en: "Sorry, I don't really know"
        key: "わからない (wakaranai) = don't know; この辺 (kono hen) = around here"
        say:
          - {ja: "すみません、ちょっとわからないです", kana: "すみません、 ちょっと わからない です"}
          - {ja: "この辺の者じゃないので、すみません", kana: "この へん の もの じゃ ない ので、 すみません", en: "Sorry, I'm not from around here"}
        note: "ちょっと… with a wince is a polite no. Thank them and ask someone else, or a konbini or a koban (police box)."
      - id: dr-walk
        p: 0.4
        en: "Shall I walk you there?"
        key: "一緒に (issho ni) = together"
        say:
          - {ja: "一緒に行きましょうか", kana: "いっしょ に いきましょう か"}
          - {ja: "近くなので、案内しますよ", kana: "ちかく な ので、 あんない します よ", en: "It's close, I'll show you"}
        replies:
          - {ja: "ありがとうございます、助かります", kana: "ありがとう ございます、 たすかります", en: "Thank you, that really helps"}
          - {ja: "大丈夫です、ありがとうございます", kana: "だいじょうぶ です、 ありがとう ございます", en: "I'm OK, thank you"}
      - {id: dr-ask-near, kind: you, en: "Is it near here?", say: [{ja: "この近くですか", kana: "この ちかく です か"}]}
      - {id: dr-ask-walk, kind: you, en: "Can I walk there?", say: [{ja: "歩いて行けますか", kana: "あるいて いけ ます か"}]}
      - {id: dr-ask-map, kind: you, en: "Could you show me on the map?", say: [{ja: "地図で教えてもらえますか", kana: "ちず で おしえて もらえ ます か"}]}

  # ── Pharmacy ─────────────────────────────────────────────────────────
  - id: pharmacy
    title: Pharmacy counter
    blurb: What's wrong, since when, allergies, other medicine, and how many to take a day.
    steps:
      - {id: ph-ask, kind: you, en: "Do you have cold medicine?", say: [{ja: "風邪薬はありますか", kana: "かぜぐすり は あります か"}]}
      - id: ph-what
        en: "What seems to be the problem?"
        key: "どうされましたか (dou saremashita ka) = what happened to you"
        say:
          - {ja: "どうされましたか", kana: "どう され ました か"}
          - {ja: "どんな症状ですか", kana: "どんな しょうじょう です か", en: "What are your symptoms?"}
        replies:
          - {ja: "頭が痛いです", kana: "あたま が いたい です", en: "I have a headache"}
          - {ja: "熱があります", kana: "ねつ が あります", en: "I have a fever"}
          - {ja: "喉が痛いです", kana: "のど が いたい です", en: "I have a sore throat"}
          - {ja: "お腹を壊しました", kana: "お なか を こわしました", en: "I have an upset stomach"}
      - id: ph-since
        p: 0.7
        en: "Since when?"
        key: "いつから (itsu kara) = since when"
        say:
          - {ja: "いつからですか", kana: "いつ から です か"}
          - {ja: "いつ頃からその症状がありますか", kana: "いつごろ から その しょうじょう が あります か"}
        replies:
          - {ja: "昨日からです", kana: "きのう から です", en: "Since yesterday"}
          - {ja: "今朝からです", kana: "けさ から です", en: "Since this morning"}
      - id: ph-allergy
        p: 0.6
        en: "Do you have any allergies?"
        key: "アレルギー (arerugii) = allergy"
        say:
          - {ja: "アレルギーはありますか", kana: "あれるぎー は あります か"}
          - {ja: "お薬のアレルギーはございますか", kana: "お くすり の あれるぎー は ございます か", en: "Are you allergic to any medicine?"}
        replies:
          - {ja: "特にないです", kana: "とくに ない です", en: "Not really, no"}
      - id: ph-other
        p: 0.5
        en: "Are you taking any other medicine?"
        key: "飲まれて (nomarete) = taking (medicine is 'drunk' in Japanese)"
        say:
          - {ja: "他にお薬は飲まれていますか", kana: "ほか に お くすり は のまれて います か"}
          - {ja: "今飲んでいるお薬はありますか", kana: "いま のんで いる お くすり は あります か"}
        replies:
          - {ja: "飲んでいません", kana: "のんで いません", en: "I'm not taking anything"}
      - id: ph-dose
        p: 0.9
        en: "Two tablets, three times a day, after meals"
        key: "一日 (ichinichi) = a day; 回 (kai) = times; 錠 (jou) = tablets; 食後 (shokugo) = after meals"
        say:
          - {ja: "一日三回、食後に二錠ずつ飲んでください", kana: "いちにち さんかい、 しょくご に にじょう ずつ のんで ください", choices: ["2 tablets, 3 times a day, after meals", "3 tablets, 2 times a day, after meals", "2 tablets, 3 times a day, before meals", "1 tablet, 3 times a day, after meals"]}
          - {ja: "一日二回、朝と夜に飲んでください", kana: "いちにち にかい、 あさ と よる に のんで ください", en: "Twice a day, morning and night", choices: ["Twice a day, morning and night", "Three times a day, with meals", "Once a day, at night", "Twice a day, before meals"]}
      - id: ph-drowsy
        p: 0.5
        en: "It can make you drowsy, so don't drive"
        key: "眠く (nemuku) = sleepy; 運転 (unten) = driving"
        say:
          - {ja: "眠くなることがありますので、運転はしないでください", kana: "ねむく なる こと が あります ので、 うんてん は しないで ください"}
          - {ja: "空腹時は避けてください", kana: "くうふくじ は さけて ください", en: "Don't take it on an empty stomach"}
      - id: ph-pharmacist
        p: 0.3
        en: "I'll check with the pharmacist. One moment."
        key: "薬剤師 (yakuzaishi) = pharmacist"
        say:
          - {ja: "薬剤師に確認しますので、少々お待ちください", kana: "やくざいし に かくにん します ので、 しょうしょう おまち ください"}
          - {ja: "こちらは薬剤師がいないと販売できません", kana: "こちら は やくざいし が いない と はんばい できません", en: "We can't sell this without the pharmacist here"}
        note: "Some medicines are sold only when the pharmacist is on duty, usually daytime. A big drugstore near a station is your best bet in the evening."
      - {id: ph-ask-dose, kind: you, en: "How many times a day?", say: [{ja: "一日何回ですか", kana: "いちにち なんかい です か"}]}

  # ── Temples, museums, sights ─────────────────────────────────────────
  - id: sights
    title: Temples, museums & sights
    blurb: Tickets, the end of the queue, shoes off, no photos, lockers, and closing time.
    steps:
      - id: sg-queue
        p: 0.5
        en: "The end of the queue is here"
        key: "最後尾 (saikoubi) = the very back of the line; 並んで (narande) = line up"
        say:
          - {ja: "最後尾はこちらです", kana: "さいこうび は こちら です"}
          - {ja: "一列に並んでお待ちください", kana: "いちれつ に ならんで おまち ください", en: "Please wait in a single line"}
      - id: sg-ticket
        p: 0.8
        en: "500 yen per adult"
        key: "大人 (otona) = adult; お一人様 (ohitorisama) = per person"
        say:
          - {ja: "大人お一人様500円です", kana: "おとな お ひとりさま ごひゃく えん です", choices: ["500 yen per adult", "500 yen for two adults", "5,000 yen per adult", "Free for adults"]}
          - {ja: "大人二名様で1600円です", kana: "おとな にめいさま で せん ろっぴゃく えん です", en: "1,600 yen for two adults", choices: ["1,600 yen for two adults", "1,600 yen per adult", "600 yen for two adults", "6,100 yen for two adults"]}
          - {ja: "チケットはあちらの券売機でお買い求めください", kana: "ちけっと は あちら の けんばいき で おかいもとめ ください", en: "Buy tickets at the machine over there"}
        replies:
          - {ja: "大人二枚お願いします", kana: "おとな にまい おねがい します", en: "Two adults, please"}
      - id: sg-shoes
        p: 0.6
        en: "Please take your shoes off here"
        key: "靴 (kutsu) = shoes; 脱いで (nuide) = take off"
        say:
          - {ja: "こちらで靴を脱いでください", kana: "こちら で くつ を ぬいで ください"}
          - {ja: "靴はこの袋に入れてお持ちください", kana: "くつ は この ふくろ に いれて おもち ください", en: "Put your shoes in this bag and carry them"}
      - id: sg-photo
        p: 0.7
        en: "No photography inside"
        key: "撮影 (satsuei) = photography; 禁止 (kinshi) = forbidden; ご遠慮ください (goenryo kudasai) = please don't"
        say:
          - {ja: "館内は撮影禁止です", kana: "かんない は さつえい きんし です"}
          - {ja: "こちらでの撮影はご遠慮ください", kana: "こちら で の さつえい は ごえんりょ ください", en: "Please don't take photos here"}
          - {ja: "フラッシュはご遠慮ください", kana: "ふらっしゅ は ごえんりょ ください", en: "No flash, please"}
        note: "ご遠慮ください sounds soft but it's a rule, not a request."
      - id: sg-locker
        p: 0.4
        en: "Please put large bags in a locker"
        key: "荷物 (nimotsu) = bags; ロッカー (rokkaa); お預け (oazuke) = leave"
        say:
          - {ja: "大きなお荷物はロッカーにお預けください", kana: "おおきな お にもつ は ろっかー に おあずけ ください"}
          - {ja: "リュックは前に持ってください", kana: "りゅっく は まえ に もって ください", en: "Please wear your backpack on your front"}
      - id: sg-close
        p: 0.5
        en: "We're closing soon"
        key: "閉館 (heikan) = closing; 最終入場 (saishuu nyuujou) = last entry"
        say:
          - {ja: "まもなく閉館時間です", kana: "まもなく へいかん じかん です"}
          - {ja: "最終入場は4時半です", kana: "さいしゅう にゅうじょう は よじはん です", en: "Last entry is at 4:30", choices: ["Last entry is at 4:30", "Last entry is at 4:00", "It closes at 4:30", "Last entry is at 8:30"]}
      - id: sg-goshuin
        p: 0.3
        en: "Do you have a goshuin book? (temple stamp)"
        key: "御朱印 (goshuin) = temple stamp; 書き置き (kakioki) = pre-written sheet"
        say:
          - {ja: "御朱印帳はお持ちですか", kana: "ごしゅいんちょう は おもち です か"}
          - {ja: "本日は書き置きのみになります", kana: "ほんじつ は かきおき のみ に なります", en: "Today it's pre-written sheets only"}
        replies:
          - {ja: "はい、これです", kana: "はい、 これ です", en: "Yes, here it is"}
          - {ja: "持っていません", kana: "もって いません", en: "I don't have one"}
      - {id: sg-ask-photo, kind: you, en: "Is it OK to take photos?", say: [{ja: "写真を撮ってもいいですか", kana: "しゃしん を とって も いい です か"}]}
      - {id: sg-ask-time, kind: you, en: "Until what time are you open?", say: [{ja: "何時までですか", kana: "なんじ まで です か"}]}

  # ── Small talk ───────────────────────────────────────────────────────
  - id: chat
    title: Small talk with locals
    blurb: The friendly questions at the next stool, on a bench or at a shrine. Where you're from, first time, your Japanese.
    steps:
      - id: ch-from
        en: "Where are you from?"
        key: "どちら (dochira) / どこ (doko) = where; から (kara) = from"
        heard: "Casual and quick: \"doko kara?\""
        say:
          - {ja: "どちらから来られたんですか", kana: "どちら から こられた ん です か"}
          - {ja: "どこから来たんですか", kana: "どこ から きた ん です か"}
          - {ja: "お国はどちらですか", kana: "お くに は どちら です か", en: "Which country are you from?"}
        replies:
          - {ja: "アメリカから来ました", kana: "あめりか から きました", en: "From the US"}
          - {ja: "カナダから来ました", kana: "かなだ から きました", en: "From Canada"}
        note: "Swap in your own country: 〇〇から来ました (… kara kimashita)."
      - id: ch-trip
        p: 0.6
        en: "Are you here on holiday?"
        key: "旅行 (ryokou) = travel; 観光 (kankou) = sightseeing; 仕事 (shigoto) = work"
        say:
          - {ja: "旅行ですか", kana: "りょこう です か"}
          - {ja: "観光ですか、お仕事ですか", kana: "かんこう です か、 お しごと です か", en: "Sightseeing or work?"}
        replies:
          - {ja: "はい、旅行です", kana: "はい、 りょこう です", en: "Yes, I'm travelling"}
          - {ja: "観光です", kana: "かんこう です", en: "Sightseeing"}
      - id: ch-first
        p: 0.7
        en: "Is this your first time in Japan?"
        key: "初めて (hajimete) = first time; 二回目 (nikaime) = second time"
        say:
          - {ja: "日本は初めてですか", kana: "にほん は はじめて です か"}
          - {ja: "日本に来るのは何回目ですか", kana: "にほん に くる の は なんかいめ です か", en: "How many times have you been to Japan?"}
        replies:
          - {ja: "はい、初めてです", kana: "はい、 はじめて です", en: "Yes, it's my first time"}
          - {ja: "二回目です", kana: "にかいめ です", en: "It's my second time"}
      - id: ch-howlong
        p: 0.6
        en: "How long are you staying in Japan?"
        key: "どのくらい (dono kurai) = how long; 週間 (shuukan) = weeks"
        say:
          - {ja: "日本にはどのくらいいるんですか", kana: "にほん に は どの くらい いる ん です か"}
          - {ja: "いつまで日本にいるんですか", kana: "いつ まで にほん に いる ん です か", en: "Until when are you in Japan?"}
        replies:
          - {ja: "二週間くらいです", kana: "にしゅうかん くらい です", en: "About two weeks"}
          - {ja: "来週帰ります", kana: "らいしゅう かえります", en: "I go home next week"}
      - id: ch-skill
        p: 0.7
        en: "Your Japanese is good!"
        key: "上手 (jouzu) = skilful"
        say:
          - {ja: "日本語上手ですね", kana: "にほんご じょうず です ね"}
          - {ja: "日本語話せるんですか", kana: "にほんご はなせる ん です か", en: "You can speak Japanese?"}
        replies:
          - {ja: "いえいえ、まだまだです", kana: "いえいえ、 まだまだ です", en: "Oh no, I've a long way to go"}
          - {ja: "少しだけです、勉強中です", kana: "すこし だけ です、 べんきょうちゅう です", en: "Just a little. I'm learning."}
        note: "Saying \"thank you\" is fine, but まだまだです (still a long way) is the expected modest answer and always gets a smile."
      - id: ch-how
        p: 0.6
        en: "How are you finding Japan?"
        key: "どう (dou) = how"
        say:
          - {ja: "日本はどうですか", kana: "にほん は どう です か"}
          - {ja: "どこに行きましたか", kana: "どこ に いきました か", en: "Where have you been so far?"}
        replies:
          - {ja: "すごく楽しいです", kana: "すごく たのしい です", en: "I'm having a great time"}
          - {ja: "ご飯がおいしいです", kana: "ごはん が おいしい です", en: "The food is delicious"}
          - {ja: "京都に行きました", kana: "きょうと に いきました", en: "I went to Kyoto"}
      - id: ch-food
        p: 0.4
        en: "Are you OK with Japanese food?"
        key: "食べ物 (tabemono) = food; 食べられます (taberaremasu) = can eat"
        say:
          - {ja: "日本の食べ物は大丈夫ですか", kana: "にほん の たべもの は だいじょうぶ です か"}
          - {ja: "納豆は食べられますか", kana: "なっとう は たべられます か", en: "Can you eat natto?"}
        replies:
          - {ja: "大好きです", kana: "だいすき です", en: "I love it"}
          - {ja: "納豆はちょっと…", kana: "なっとう は ちょっと", en: "Natto is a bit… (no)"}
      - id: ch-photo
        p: 0.4
        en: "Shall I take your photo?"
        key: "写真 (shashin) = photo; 撮り (tori) = take"
        say:
          - {ja: "写真撮りましょうか", kana: "しゃしん とりましょう か"}
          - {ja: "撮りますよ、はい、チーズ", kana: "とります よ、 はい、 ちーず", en: "Taking it now. Say cheese!"}
        replies:
          - {ja: "お願いします", kana: "おねがい します", en: "Yes, please"}
          - {ja: "大丈夫です、ありがとうございます", kana: "だいじょうぶ です、 ありがとう ございます", en: "I'm fine, thanks"}
      - id: ch-bye
        en: "Enjoy your trip!"
        key: "楽しんで (tanoshinde) = enjoy; 気をつけて (ki o tsukete) = take care"
        say:
          - {ja: "楽しんでくださいね", kana: "たのしんで ください ね"}
          - {ja: "気をつけてね", kana: "き を つけて ね", en: "Take care!"}
          - {ja: "良い旅を", kana: "よい たび を", en: "Have a good trip!"}
        replies:
          - {ja: "ありがとうございます", kana: "ありがとう ございます", en: "Thank you"}
      - {id: ch-ask-photo, kind: you, en: "Could you take a photo of us?", say: [{ja: "写真を撮ってもらえますか", kana: "しゃしん を とって もらえ ます か"}]}
      - {id: ch-ask-local, kind: you, en: "Is there a place you'd recommend around here?", say: [{ja: "この辺でおすすめの場所はありますか", kana: "この へん で おすすめ の ばしょ は あります か"}]}

  # ── Your turn: chaining requests and lifelines ───────────────────────
  - id: yours
    title: Your turn
    blurb: Chain what you want into one sentence, ask if something is good, and the lifelines for when you didn't catch it.
    steps:
      - {id: yt-chain, kind: you, en: "This, this, and also this, please.", say: [{ja: "これとこれと、あとこれもお願いします", kana: "これ と これ と、 あと これ も おねがい します"}]}
      - {id: yt-two-one, kind: you, en: "Two of these and one of that, please.", say: [{ja: "これを二つと、それを一つください", kana: "これ を ふたつ と、 それ を ひとつ ください"}]}
      - {id: yt-nobag, kind: you, en: "No need to heat it. Just a bag, please.", say: [{ja: "温めはいいです。袋だけお願いします", kana: "あたため は いい です。 ふくろ だけ おねがい します"}]}
      - {id: yt-hashi-bag, kind: you, en: "Two pairs of chopsticks and a bag, please.", say: [{ja: "お箸を二膳と、袋をお願いします", kana: "お はし を にぜん と、 ふくろ を おねがい します"}]}
      - {id: yt-cafe, kind: you, en: "For here. An iced coffee, medium, please.", say: [{ja: "店内で。アイスコーヒーのMサイズをお願いします", kana: "てんない で。 あいす こーひー の えむ さいず を おねがい します"}]}
      - {id: yt-good, kind: you, en: "Is this one good? (do you recommend it?)", say: [{ja: "これはおすすめですか", kana: "これ は おすすめ です か"}]}
      - {id: yt-popular, kind: you, en: "Which one is the most popular?", say: [{ja: "一番人気はどれですか", kana: "いちばん にんき は どれ です か"}]}
      - {id: yt-spicy, kind: you, en: "Is this spicy?", say: [{ja: "これは辛いですか", kana: "これ は からい です か"}]}
      - {id: yt-same, kind: you, en: "One more of the same, please.", say: [{ja: "同じものをもう一つください", kana: "おなじ もの を もう ひとつ ください"}]}
      - {id: yt-decide, kind: you, en: "I'll take this one.", say: [{ja: "これにします", kana: "これ に します"}]}
      - {id: yt-smaller, kind: you, en: "Do you have a smaller size?", say: [{ja: "小さいサイズはありますか", kana: "ちいさい さいず は あります か"}]}
      - {id: yt-again, kind: you, en: "Lifeline: one more time, please.", say: [{ja: "もう一回お願いします", kana: "もう いっかい おねがい します"}]}
      - {id: yt-slow, kind: you, en: "Lifeline: could you say it slowly?", say: [{ja: "ゆっくり言ってもらえますか", kana: "ゆっくり いって もらえ ます か"}]}
      - {id: yt-missed, kind: you, en: "Lifeline: sorry, I didn't catch that.", say: [{ja: "すみません、聞き取れませんでした", kana: "すみません、 ききとれ ません でした"}]}
      - {id: yt-english, kind: you, en: "Lifeline: is English OK?", say: [{ja: "英語でも大丈夫ですか", kana: "えいご でも だいじょうぶ です か"}]}
