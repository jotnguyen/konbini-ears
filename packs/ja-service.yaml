        replies:
          - {ja: "ごちそうさまでした", kana: "ごちそうさま でした", en: "Thanks for the meal"}

  # ── Ramen ────────────────────────────────────────────────────────────
  - id: ramen
    title: Ramen shop
    blurb: Ticket machine first, then noodle firmness, richness, oil, garlic. Shouted over a kitchen.
    steps:
      - id: rm-greet
        en: "Welcome!"
        heard: "Shouted and clipped: \"rasshai!\" Every cook joins in."
        say:
          - {ja: "いらっしゃいませ", kana: "いらっしゃいませ"}
          - {ja: "らっしゃい", kana: "らっしゃい"}
      - id: rm-ticket
        p: 0.8
        en: "Buy a meal ticket first, please"
        key: "食券 (shokken) = meal ticket"
        say:
          - {ja: "先に食券をお願いします", kana: "さき に しょっけん を おねがい します"}
          - {ja: "食券を買ってからお座りください", kana: "しょっけん を かって から おすわり ください"}
          - {ja: "食券お預かりします", kana: "しょっけん おあずかり します", en: "I'll take your ticket"}
      - id: rm-firm
        p: 0.7
        en: "How firm do you want the noodles?"
        key: "麺 (men) = noodles; 固さ (katasa) = firmness"
        say:
          - {ja: "麺の固さはどうしますか", kana: "めん の かたさ は どう します か"}
          - {ja: "麺の固さ、普通でよろしいですか", kana: "めん の かたさ、 ふつう で よろしい です か", en: "Regular firmness OK?"}
          - {ja: "麺の固さはいかがなさいますか", kana: "めん の かたさ は いかが なさい ます か"}
        replies:
          - {ja: "普通で", kana: "ふつう で", en: "Regular"}
          - {ja: "固めで", kana: "かため で", en: "Firm"}
          - {ja: "柔らかめで", kana: "やわらかめ で", en: "Soft"}
      - id: rm-rich
        p: 0.5
        en: "How strong do you want the flavor?"
        key: "味 (aji) = flavor; 濃さ (kosa) = strength; 油 (abura) = oil"
        say:
          - {ja: "味の濃さはどうしますか", kana: "あじ の こさ は どう します か"}
          - {ja: "油の量はどうしますか", kana: "あぶら の りょう は どう します か", en: "How much oil?"}
        replies:
          - {ja: "普通で", kana: "ふつう で", en: "Regular"}
          - {ja: "少なめで", kana: "すくなめ で", en: "Less"}
          - {ja: "多めで", kana: "おおめ で", en: "More"}
      - id: rm-garlic
        p: 0.4
        en: "Do you want garlic?"
        key: "ニンニク (ninniku) = garlic"
        say:
          - {ja: "ニンニク入れますか", kana: "にんにく いれ ます か"}
          - {ja: "トッピングはどうしますか", kana: "とっぴんぐ は どう します か", en: "Any toppings?"}
        replies:
          - {ja: "お願いします", kana: "おねがい します", en: "Yes, please"}
          - {ja: "なしで", kana: "なし で", en: "None"}
      - id: rm-refill
        p: 0.3
        en: "Would you like a noodle refill?"
        key: "替え玉 (kaedama) = extra noodles; おかわり (okawari) = refill"
        say:
          - {ja: "替え玉いかがですか", kana: "かえだま いかが です か"}
          - {ja: "ライスはおかわり自由です", kana: "らいす は おかわり じゆう です", en: "Rice refills are free"}
        replies:
          - {ja: "替え玉お願いします", kana: "かえだま おねがい します", en: "A refill, please"}
          - {ja: "大丈夫です", kana: "だいじょうぶ です", en: "I'm good"}
      - id: rm-bye
        en: "Thank you!"
        say:
          - {ja: "ありがとうございました", kana: "ありがとう ございました"}
        replies:
          - {ja: "ごちそうさまでした", kana: "ごちそうさま でした", en: "Thanks for the meal"}

  # ── Shops & drugstores ───────────────────────────────────────────────
  - id: shop
    title: Shops & drugstores
    blurb: Just looking, out of stock, tax-free, gift or for yourself, and the bag that costs extra.
    steps:
      - id: sh-greet
        en: "Welcome, have a look around"
        key: "ご覧ください (goran kudasai) = please look"
        say:
          - {ja: "いらっしゃいませ、どうぞご覧ください", kana: "いらっしゃいませ、 どうぞ ごらん ください"}
          - {ja: "いらっしゃいませ", kana: "いらっしゃいませ"}
      - id: sh-help
        p: 0.6
        en: "Are you looking for something?"
        key: "お探し (osagashi) = searching"
        say:
          - {ja: "何かお探しですか", kana: "なにか おさがし です か"}
          - {ja: "何かございましたらお声がけください", kana: "なにか ございましたら お こえがけ ください", en: "Let me know if you need anything"}
        replies:
          - {ja: "見ているだけです", kana: "みて いる だけ です", en: "Just looking"}
          - {ja: "これはありますか", kana: "これ は あります か", en: "Do you have this? (show a photo)"}
      - id: sh-stock
        p: 0.3
        en: "Sorry, we're out of stock"
        key: "在庫 (zaiko) = stock; 切らして (kirashite) = run out"
        say:
          - {ja: "申し訳ございません、ただいま在庫を切らしております", kana: "もうしわけ ございません、 ただいま ざいこ を きらして おります"}
          - {ja: "在庫を確認してきます", kana: "ざいこ を かくにん して きます", en: "I'll go check the stock"}
      - id: sh-try
        p: 0.3
        en: "Would you like to try it on?"
        key: "試着 (shichaku) = trying on"
        say:
          - {ja: "ご試着されますか", kana: "ご しちゃく され ます か"}
          - {ja: "試着室はこちらです", kana: "しちゃくしつ は こちら です", en: "The fitting room is over here"}
        replies:
          - {ja: "はい、お願いします", kana: "はい、 おねがい します", en: "Yes, please"}
          - {ja: "大丈夫です", kana: "だいじょうぶ です", en: "No thanks"}
      - id: sh-taxfree
        p: 0.6
        en: "Would you like it tax-free?"
        key: "免税 (menzei) = tax-free; パスポート (pasupooto)"
        say:
          - {ja: "免税をご希望ですか", kana: "めんぜい を ごきぼう です か"}
          - {ja: "パスポートはお持ちですか", kana: "ぱすぽーと は おもち です か", en: "Do you have your passport?"}
          - {ja: "免税は5000円以上からになります", kana: "めんぜい は ごせん えん いじょう から に なります", en: "Tax-free starts at 5,000 yen", choices: ["Tax-free starts at 5,000 yen", "Tax-free starts at 500 yen", "Tax-free starts at 50,000 yen", "Tax-free is not available"]}
        replies:
          - {ja: "はい、お願いします", kana: "はい、 おねがい します", en: "Yes, please"}
          - {ja: "パスポートです", kana: "ぱすぽーと です", en: "Here's my passport"}
      - id: sh-gift
        p: 0.3
        en: "Is this a gift?"
        key: "プレゼント用 (purezento-you) = for a gift; ご自宅用 (gojitaku-you) = for home"
        say:
          - {ja: "プレゼント用ですか", kana: "ぷれぜんと よう です か"}
          - {ja: "ご自宅用でよろしいですか", kana: "ご じたく よう で よろしい です か", en: "For yourself (no gift wrap)?"}
        replies:
          - {ja: "自分用です", kana: "じぶん よう です", en: "It's for me"}
          - {ja: "プレゼント用です", kana: "ぷれぜんと よう です", en: "It's a gift"}
      - id: sh-bag
        p: 0.5
        en: "Bags cost extra. Is that OK?"
        key: "有料 (yuuryou) = costs money; 紙袋 (kamibukuro) = paper bag"
        say:
          - {ja: "袋は有料ですがよろしいですか", kana: "ふくろ は ゆうりょう です が よろしい です か"}
          - {ja: "紙袋にお入れしますか", kana: "かみぶくろ に おいれ します か", en: "Shall I put it in a paper bag?"}
        replies:
          - {ja: "はい、お願いします", kana: "はい、 おねがい します", en: "Yes, please"}
          - {ja: "大丈夫です", kana: "だいじょうぶ です", en: "No thanks"}
      - id: sh-bye
        en: "Thank you very much"
        say:
          - {ja: "ありがとうございました", kana: "ありがとう ございました"}
          - {ja: "ありがとうございました、またお越しくださいませ", kana: "ありがとう ございました、 また おこし くださいませ"}

  # ── Hotel ────────────────────────────────────────────────────────────
  - id: hotel
    title: Hotel front desk
    blurb: Checking in, your name, the passport, the form, breakfast times, luggage.
    steps:
      - id: ht-checkin
        en: "Welcome. Checking in?"
        key: "チェックイン (chekkuin)"
        say:
          - {ja: "いらっしゃいませ、チェックインでしょうか", kana: "いらっしゃいませ、 ちぇっくいん でしょう か"}
          - {ja: "チェックインですか", kana: "ちぇっくいん です か"}
        replies:
          - {ja: "はい、予約しています", kana: "はい、 よやく して います", en: "Yes, I have a reservation"}
      - id: ht-name
        en: "May I have your name?"
        key: "お名前 (onamae) = your name"
        say:
          - {ja: "お名前をお伺いしてもよろしいですか", kana: "お なまえ を おうかがい して も よろしい です か"}
          - {ja: "ご予約のお名前をお願いします", kana: "ご よやく の お なまえ を おねがい します"}
      - id: ht-passport
        p: 0.8
        en: "May I see your passport?"
        key: "拝見 (haiken) = (humbly) see"
        say:
